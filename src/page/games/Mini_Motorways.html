<html lang="vi"><head><meta charset="utf-8">

<style>

.sp{display:none}

<header>
<div class="brand"><i>↗</i><b>Mini Motorways</b></div>
<span id="mb"></span>
<button id="md" class="on">Vẽ</button><button id="me">Xoá</button>
<span class="sp"></span>
<span class="st"><span>Điểm <b id="sc">0</b></span><span>Tuần <b id="wk">1</b></span><span>Đường còn <b id="rd">0</b></span><span>Cầu <b id="br">0</b></span><span>Kỷ lục <b id="bs">0</b></span></span>
<button id="rs">Chơi lại</button>
</header>
<div id="w"><canvas id="cv"></canvas>
<div id="over" hidden><h2>Kẹt xe rồi!</h2><div id="ov"></div><button id="again">Chơi lại</button></div></div>
<footer><span>Kéo từ nhà tới điểm đến cùng màu để vẽ đường · Vẽ đường trên mặt nước sẽ dùng cầu · Bấm “Xoá” để thu hồi đường</span></footer>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d');
const G=24,H=16,N=G*H,COL=['#e8603c','#3b8fd9','#f2b134','#43a86b','#9b59b6'],D=[[1,0],[-1,0],[0,1],[0,-1]];
const MAPS=[
{n:"Đồng bằng",w:[]},
{n:"Dòng sông",w:[[10,0,3,6],[10,8,3,8]]},
{n:"Hồ trung tâm",w:[[8,4,8,8]]},
{n:"Quần đảo",w:[[0,7,9,2],[12,7,12,2],[11,0,2,6],[11,10,2,6]]}];
let pw=1,br=0,wk=1,uid=0,C=30,baseC=30,mi=0,road,water,bAt,bl,cars,score,left,t,over,sp,colors,mode='draw',drag=null,er=false,best={};
try{best=JSON.parse(localStorage.getItem('mmbest')||'{}')}catch(e){}
MAPS.forEach((m,i)=>{const b=document.createElement('button');b.className='m';b.textContent=m.n;b.onclick=()=>init(i);$('#mb').append(b)});
const inb=(x,y)=>x>=0&&y>=0&&x<G&&y<H;
function init(i){mi=i;road=new Uint8Array(N);water=new Uint8Array(N);bAt=new Int16Array(N).fill(-1);bl=[];cars=[];score=0;left=40;br=2;wk=1;pw=1;t=0;over=false;sp=10;colors=1;fitMap();$('#w').scrollLeft=0;$('#w').scrollTop=0;
MAPS[i].w.forEach(([x,y,w,h])=>{for(let a=x;a<x+w;a++)for(let b=y;b<y+h;b++)water[b*G+a]=1});
spawn(0,false);spawn(0,true);$('#over').hidden=true;
document.querySelectorAll('.m').forEach((b,k)=>b.classList.toggle('on',k==i));$('#bs').textContent=best[i]||0}
function spawn(c,d){const z=d?[[3,2],[2,3]][(Math.random()*2)|0]:[1,1],w=z[0],h=z[1];for(let k=0;k<400;k++){const x=(1+Math.random()*(G-1-w))|0,y=(1+Math.random()*(H-1-h))|0,i=y*G+x;
let bad=0;for(let a=0;a<w;a++)for(let e=0;e<h;e++){const j=i+e*G+a;if(water[j]||road[j]||bAt[j]>=0)bad=1}if(bad)continue;

if(bl.some(b=>b.en.some(q=>{const qx=q.o%G,qy=(q.o/G)|0;return qx>=x&&qx<x+w&&qy>=y&&qy<y+h})))continue;

let en=[],dbl=false,lot=null,bld=null;if(!d){if(cand.length)en=[cand[(Math.random()*cand.length)|0]]}else{const hz=w==3,sA=Math.random()<.5;
lot=hz?(sA?[[0,0,1,2]]:[[2,0,1,2]]):(sA?[[0,0,2,1]]:[[0,2,2,1]]);bld=hz?(sA?[1,0,2,2]:[0,0,2,2]):(sA?[0,1,2,2]:[0,0,2,2]);
const lx=x+lot[0][0],ly=y+lot[0][1];let ends;
if(hz)ends=[{o:(ly-1)*G+lx,i:ly*G+lx,j:(ly+1)*G+lx,k:inb(lx,ly-1)},{o:(ly+2)*G+lx,i:(ly+1)*G+lx,j:ly*G+lx,k:inb(lx,ly+2)}];
else ends=[{o:ly*G+lx-1,i:ly*G+lx,j:ly*G+lx+1,k:inb(lx-1,ly)},{o:ly*G+lx+2,i:ly*G+lx+1,j:ly*G+lx,k:inb(lx+2,ly)}];
ends=ends.filter(q=>q.k&&!water[q.o]&&bAt[q.o]<0).map(({o,i,j})=>({o,i,j}));
if(ends.length)en=[ends[(Math.random()*ends.length)|0]]}
if(!en.length)continue;
for(let a=0;a<w;a++)for(let e=0;e<h;e++)bAt[i+e*G+a]=bl.length;const rd=d&&bl.some(q=>q.d)&&t>=40&&Math.random()<.45;bl.push({x,y,w,h,c,d,en,dbl,lot,bld,rd,cap:rd?8:6,idle:true,pin:0,out:0,tm:3,cd:0,dg:0});return}}
function path(b){const goal=new Int16Array(N);
bl.forEach((d,k)=>{if(d.d&&d.c==b.c)d.en.forEach((q,m)=>{if(road[q.o])goal[q.o]=k*8+m+1})});
const prev=new Int16Array(N).fill(-2),q=[];
b.en.forEach(s=>{if(road[s.o]){prev[s.o]=-1;q.push(s.o)}});
for(let h=0;h<q.length;h++){const i=q[h];
if(goal[i]){const p=[];for(let j=i;j!=-1;j=prev[j])p.unshift(j);const gd=goal[i]-1;return [b.y*G+b.x,...p,bl[gd>>3].en[gd&7].i]}
const x=i%G,y=(i/G)|0;
D.forEach(([dx,dy])=>{const X=x+dx,Y=y+dy,j=Y*G+X;if(inb(X,Y)&&road[j]&&prev[j]==-2){prev[j]=i;q.push(j)}})}
return null}
function upd(dt){if(over)return;t+=dt;sp-=dt;
if(sp<=0){sp=Math.max(5,13-t/40);const nc=Math.min(5,1+((t/50)|0));
if(nc>colors){colors=nc;spawn(nc-1,true);spawn(nc-1,false)}else{const c=(Math.random()*colors)|0;spawn(c,false);if(Math.random()<.4)spawn(c,true)}}
bl.forEach(b=>{if(!b.d)return;b.tm-=dt;b.cd-=dt;
if(b.tm<=0){if(b.pin<b.cap)b.pin++;b.tm=Math.max(4,8-t/60)+Math.random()*2}
if(b.pin>b.out&&b.cd<=0){b.cd=.5;const p=disp(b);if(p){b.out++;cars.push(p)}}
if(b.pin>=b.cap){b.dg+=dt;if(b.dg>=15)over=true}else b.dg=Math.max(0,b.dg-dt)});

cars=cars.filter(a=>{if(a.st=='wait'){a.wt+=dt;if(a.wt<TOT)return true;if(a.rw>0){a.rw-=dt;return true}const g=new Uint8Array(N);a.h.en.forEach(q=>{if(road[q.o])g[q.o]=1});const n=a.p.length,p=bfs([a.p[n-1-a.tl]],g);if(!p){a.rw=.5;return true}a.st='ret';a.p=[...a.p.slice(n-a.tl).reverse(),...p,a.h.y*G+a.h.x];a.i=0;a.f=0;a.v=0;return true}
if(a.p.slice(1,-1).some(j=>!road[j]&&bAt[j]<0)){const s=[a.p[a.i],a.p[a.i+1],a.p[a.i-1]].find(j=>j!=null&&road[j]);if(s==null||!rt(a,s)){if(s==null){a.h.idle=true;if(a.st=='out')a.d.out--;return false}a.stk=1;a.v=0;return true}}
const k=cp(a),bk=cars.some(o=>{if(o===a)return false;const m=cpp(o),rx=m[0]-k[0],ry=m[1]-k[1],dp=rx*k[2]+ry*k[3],cr=Math.abs(rx*k[3]-ry*k[2]);return cr<.16&&dp<.7&&(dp>.01||(dp>-.01&&o.id<a.id))&&m[2]*k[2]+m[3]*k[3]>.5});
const cc=a.f<.5?a.p[a.i]:a.p[a.i+1],vm=D.filter(([dx,dy])=>{const X=cc%G+dx,Y=((cc/G)|0)+dy;return inb(X,Y)&&road[Y*G+X]}).length>=3?1.6:3.2;a.v=bk?0:Math.min(vm,a.v+dt*8);a.stop=bk;a.f+=dt*a.v;
while(a.f>=1){a.f-=1;a.i++;if(a.i>=a.p.length-1){if(a.st=='out'){a.d.pin--;a.d.out--;score++;a.st='wait';a.wt=0;a.rw=0;a.f=0;return true}a.h.idle=true;return false}}return true});
if(over){if(score>(best[mi]||0)){best[mi]=score;try{localStorage.setItem('mmbest',JSON.stringify(best))}catch(e){}}
$('#ov').textContent='Điểm: '+score+' · Map: '+MAPS[mi].n;$('#over').hidden=false;$('#bs').textContent=best[mi]||0}}
function bfs(S,goal){const prev=new Int16Array(N).fill(-2),q=[];S.forEach(s=>{if(road[s]){prev[s]=-1;q.push(s)}});for(let h=0;h<q.length;h++){const i=q[h];if(goal[i]){const p=[];for(let j=i;j!=-1;j=prev[j])p.unshift(j);return p}const x=i%G,y=(i/G)|0;D.forEach(([dx,dy])=>{const X=x+dx,Y=y+dy,j=Y*G+X;if(inb(X,Y)&&road[j]&&prev[j]==-2){prev[j]=i;q.push(j)}})}return null}
function disp(d){const g=new Uint8Array(N);bl.forEach((h,k)=>{if(!h.d&&h.idle&&h.c==d.c)h.en.forEach(q=>{if(road[q.o])g[q.o]=k+1})});const p=bfs(d.en.map(q=>q.o),g);if(!p)return null;p.reverse();const h=bl[g[p[0]]-1],q=d.en.find(q=>q.o==p[p.length-1]);h.idle=false;const tl=Math.random()<.5?2:1;return {tl,s:Math.random()<.5?1:-1,rw:0,p:[h.y*G+h.x,...p,q.i,...(tl==2?[q.j]:[])],i:0,f:0,v:2,id:uid++,c:d.c,h,d,st:'out',wt:0}}
function rt(a,s){const g=new Uint8Array(N),T=a.st=='out'?a.d:a.h;T.en.forEach(q=>{if(road[q.o])g[q.o]=1});const p=bfs([s],g);if(!p)return false;const q=T.en.find(q=>q.o==p[p.length-1]);const tl=q.j!=null&&Math.random()<.5?2:1;a.tl=tl;a.p=[...p,q.i,...(tl==2?[q.j]:[])];a.i=0;a.f=0;a.stk=0;return true}
function sh(b){if(b.d){const px=b.x*C,py=b.y*C,pw=b.w*C,ph=b.h*C;ctx.fillStyle='#eef0e4';ctx.beginPath();ctx.roundRect(px+C*.06,py+C*.06,pw-C*.12,ph-C*.12,C*.25);ctx.fill();b.lot.forEach(([a,e,lw,lh])=>{const lx=px+a*C,ly=py+e*C;ctx.fillStyle='#e2e6d8';ctx.beginPath();ctx.roundRect(lx+C*.1,ly+C*.1,lw*C-C*.2,lh*C-C*.2,C*.12);ctx.fill();const q=b.en[0],u0=(q.i%G)-(q.o%G),v0=((q.i/G)|0)-((q.o/G)|0),nx=-v0,ny=u0,t0=Math.atan2(v0,u0);for(let m=0;m<lw*lh;m++){const cx=(b.x+a+(m%lw)+.5)*C,cy=(b.y+e+((m/lw)|0)+.5)*C;[1,-1].forEach(s=>{ctx.save();ctx.translate(cx+nx*s*.2*C,cy+ny*s*.2*C);ctx.rotate(t0+s*.7);ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=Math.max(1.5,C*.05);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(-.2*C,-.115*C);ctx.lineTo(.2*C,-.115*C);ctx.lineTo(.2*C,.115*C);ctx.lineTo(-.2*C,.115*C);ctx.stroke();ctx.restore()})}})}const x=(b.x+(b.d?b.bld[0]:0))*C+(b.d?.2:.17)*C,y=(b.y+(b.d?b.bld[1]:0))*C+(b.d?.2:.15)*C,w=(b.d?2:b.w)*C-(b.d?.4:.34)*C,h=(b.d?2:b.h)*C-(b.d?.4:.34)*C,s=C*(b.d?.8:.5);ctx.fillStyle='rgba(60,80,110,.2)';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w+s,y+s);ctx.lineTo(x+w+s,y+h+s);ctx.lineTo(x+s,y+h+s);ctx.lineTo(x,y+h);ctx.fill()}
function pin(x,y,r,col,p){const c=y-r*1.5;ctx.fillStyle=p?col:'#4a3b3b';ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,c,r,2.412,7.012);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,c,r*.55,0,7);ctx.fill();if(p){ctx.fillStyle='#4a3b3b';ctx.beginPath();ctx.moveTo(x,c);ctx.arc(x,c,r*.55,-1.5708,-1.5708+6.2832*p);ctx.fill()}}
function nb(b){const X=b.x*C,Y=b.y*C,col=COL[b.c];b.wn=[];
if(b.d){const m=C*.2,x=X+b.bld[0]*C+m,y=Y+b.bld[1]*C+m,w=2*C-2*m,h=2*C-2*m,e=C*.07,rd=b.rd,cx=x+w/2,cy=y+h/2;
[[2,.45],[1,.25],[0,-.12]].forEach(([k,sd])=>{ctx.fillStyle=col;ctx.beginPath();if(rd)ctx.arc(cx+k*e,cy+k*e,w/2,0,7);else ctx.roundRect(x+k*e,y+k*e,w,h,C*.12);ctx.fill();ctx.fillStyle=sd>0?'rgba(60,10,60,'+sd+')':'rgba(255,255,255,'+(-sd)+')';ctx.fill()});
for(let k=0;k<b.pin;k++){if(rd){const a=-1.5708+k*.785;pin(cx+w*.3*Math.cos(a),cy+w*.3*Math.sin(a)+C*.1,C*.1,col,0)}else{const cl=k%3,rw=(k/3)|0;pin(cx+(cl-1)*C*.3,cy-C*.02+rw*C*.38,C*.1,col,0)}}
if(b.dg)pin(cx,y-C*.12,C*.3,'#e0415a',b.dg/15)}
else{const s=C*.48,x=X+(C-s)/2,y=Y+(C-s)/2,r=C*.075,q=b.en[0],dx=q?(q.o%G-b.x):1,dy=q?(((q.o/G)|0)-b.y):0;ctx.fillStyle='rgba(0,0,0,.24)';ctx.beginPath();ctx.roundRect(x+C*.035,y+C*.045,s,s,r);ctx.fill();ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,s,s,r);ctx.fill();ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(x+C*.025,y+C*.025,s-C*.05,s*.38);ctx.fillStyle='#d88743';ctx.fillRect(x+C*.025,y+s*.62,s-C*.05,s*.34);ctx.fillStyle='#fff1c6';if(dx>0)ctx.fillRect(x+s-C*.035,y+s*.42,C*.035,s*.28);else if(dx<0)ctx.fillRect(x,y+s*.42,C*.035,s*.28);else if(dy>0)ctx.fillRect(x+s*.4,y+s-C*.035,s*.22,C*.035);else ctx.fillRect(x+s*.4,y,s*.22,C*.035);ctx.fillStyle='rgba(35,42,53,.65)';ctx.fillRect(x+s*.23,y+s*.22,C*.055,C*.07);ctx.fillRect(x+s*.68,y+s*.22,C*.055,C*.07);}}
const TOT=1.8;
function wp(a){const n=a.p.length,o=a.p[n-1-a.tl],i=a.p[n-a.tl],L=a.p[n-1],ux=(i%G)-(o%G),uy=((i/G)|0)-((o/G)|0),px=-uy,py=ux,cx=(L%G)+.5,cy=((L/G)|0)+.5,s=a.s,t0=Math.atan2(uy,ux),ts=t0+s*.7,bx=cx+px*.14,by=cy+py*.14,sx=cx+px*s*.2,sy=cy+py*s*.2,ex=cx-px*.14,ey=cy-py*.14,te=t0+s*Math.PI,e=Math.min(a.wt,TOT),E=k=>k*k*(3-2*k);
