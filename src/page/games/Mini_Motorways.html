function okH(i){const x=i%G,y=(i/G)|0;return D.every(([dx,dy])=>{const X=x+dx,Y=y+dy;if(!inb(X,Y))return true;const j=Y*G+X,k=bAt[j];if(k<0||!bl[k].d)return true;let n=0;D.forEach(([ex,ey])=>{const U=X+ex,V=Y+ey;if(inb(U,V)&&road[V*G+U])n++});return n<2||bl[k].opts.some(q=>q.o===i)})}
