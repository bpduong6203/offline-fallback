<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>🐔 MebiFarm</title>
<style>
  :root { --ink:#3a2a1e; --card:rgba(250,243,230,.94); }
  @media (prefers-color-scheme: dark) { :root { --ink:#f3e6cf; --card:rgba(38,28,22,.94); } }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; overflow:hidden; font-family: system-ui,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:linear-gradient(#6a7a96,#dcc1a0 58%,#f4dcb4); user-select:none; }
  canvas { position:fixed; inset:0; display:block; touch-action:none; }
  .card { position:fixed; z-index:10; background:var(--card); border-radius:16px; padding:8px 14px; font-weight:700; box-shadow:0 4px 0 rgba(0,0,0,.12); }
  button { font:inherit; font-weight:800; border:0; border-radius:14px; padding:9px 14px; background:#9a2016; color:#fbeccc; cursor:pointer; box-shadow:0 4px 0 #5e130d; }
  button.alt { background:#8a6a2a; box-shadow:0 4px 0 #52401a; }
  button:active:not(:disabled) { transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.3); }
  button:disabled { opacity:.45; cursor:default; }
  #top { top:calc(env(safe-area-inset-top,0px) + 10px); left:10px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:14px; max-width:calc(100vw - 130px); }
  #top b { font-size:16px; }
  .lvl { display:flex; align-items:center; gap:6px; }
  .lvl .bar { width:90px; height:10px; border-radius:6px; background:rgba(0,0,0,.18); overflow:hidden; display:inline-block; }
  .lvl .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#c9a14a,#e8c46a); transition:width .3s; }
  .lvl small { font-size:11px; opacity:.7; font-weight:600; }
  .up.locked { opacity:.6; }
  .up .need { font-size:11px; font-weight:700; color:#b8332f; white-space:nowrap; }
  #tools { position:fixed; z-index:11; top:calc(env(safe-area-inset-top,0px) + 10px); right:10px; display:flex; gap:8px; }
  button.ic { width:40px; height:40px; padding:0; border-radius:50%; font-size:18px; line-height:40px; background:var(--card); color:var(--ink); box-shadow:0 3px 0 rgba(0,0,0,.15); }
  button.ic.on { background:#8a6a2a; color:#fbeccc; }
  #flow { left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 70px); display:flex; gap:6px; align-items:center; font-size:12px; padding:6px 10px; max-width:96vw; overflow-x:auto; white-space:nowrap; }
  #flow span.chip { padding:2px 8px; border-radius:10px; background:rgba(0,0,0,.08); }
  #flow span.lock { opacity:.45; }
  #flow i { opacity:.5; font-style:normal; }
  #acts { position:fixed; z-index:10; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 12px); display:flex; gap:8px; max-width:96vw; flex-wrap:wrap; justify-content:center; }
  #acts button { font-size:14px; white-space:nowrap; }
  #shop { display:none; top:calc(env(safe-area-inset-top,0px) + 58px); right:10px; width:min(330px,94vw); max-height:calc(100vh - 150px); overflow-y:auto; padding:10px; font-size:13px; z-index:12; }
  #shop.open { display:block; }
  #shop h4 { margin:0 0 8px; font-size:14px; }
  .up { display:flex; gap:8px; align-items:center; padding:7px 0; border-top:1px solid rgba(128,128,128,.25); }
  .up .t { flex:1; min-width:0; } .up .t small { display:block; font-weight:600; opacity:.7; font-size:11px; }
  .up button { padding:7px 10px; font-size:12px; white-space:nowrap; }
  #foc { position:fixed; z-index:10; left:10px; top:calc(env(safe-area-inset-top,0px) + 62px); display:flex; gap:6px; }
  #foc button { padding:6px 10px; font-size:12px; }
  #toast { top:calc(env(safe-area-inset-top,0px) + 108px); left:50%; transform:translateX(-50%); opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; font-size:13px; z-index:20; }
</style>
</head>
<body>
<div id="top" class="card">
  <span class="lvl">⭐ Lv <b id="vLv">1</b><span class="bar"><i id="vXp"></i></span><small id="vXpT"></small></span>
  <span>🪙 <b id="vCoins">0</b></span>
  <span>🌾 Kho cám <b id="vFeed">0</b></span>
  <span>🐔 <b id="vHens">0</b>/<span id="vMax">0</span></span>
</div>
<div id="tools">
  <button id="bShop" class="ic" title="Nâng cấp">🛠️</button>
  <button id="bTemple" class="ic" title="Về chùa MEBI">🏯</button>
</div>
<div id="foc">
  <button class="alt" data-f="coop">🐔 Chuồng</button><button class="alt" data-f="fac">🏭 Nhà máy</button><button class="alt" data-f="shop">🚚 Bán hàng</button>
</div>
<div id="shop" class="card"><h4>🛠️ Nâng cấp & mua sắm</h4><div id="upList"></div></div>
<div id="flow" class="card"></div>
<div id="acts">
  <button id="bFeed">🌾 Rải cám</button><button id="bBuyFeed" class="alt">🛒 Mua cám</button><button id="bCollect">🧺 Thu trứng</button><button id="bSell">🚚 Bán hàng</button>
</div>
<div id="toast" class="card"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const TEMPLE_URL = "chua-mebi.html"; // đổi nếu file chùa đặt tên/đường dẫn khác

// LOGIC_START ===========================================================
const SIZES = ["S", "M", "L"];
const SIZE_P = { S: 0.3, M: 0.5, L: 0.2 };
const PRICE = { loose: 1.5, S: 2.2, M: 2.8, L: 3.6 }; // giá/quả khi bán rời
const PACK_P = { S: 3.0, M: 3.8, L: 5.0 }; // giá/quả khi đã đóng vỉ
const CARTON_BONUS = 1.15;
const BREAK_RATE = 0.08;
const FEED_PACK = 50, FEED_COST = 25;
const hensMax = (s) => 3 + 3 * s.lv.coop;
const nestCap = (s) => 10 + 10 * s.lv.coop;
const troughCap = (s) => 20 + 10 * s.lv.coop;
const layBase = (s) => 26 * Math.pow(0.86, s.lv.breed);
const newHen = (s) => ({ h: 0.3, l: layBase(s) * (0.4 + Math.random()) });

function newState() {
  const s = {
    v: 1, t0: Date.now(), coins: 100, feed: 40, trough: 10, nest: 0, basket: 0, clean: 0,
    g: { S: 0, M: 0, L: 0 }, packs: { S: 0, M: 0, L: 0 }, cartons: { S: 0, M: 0, L: 0 },
    broken: 0, totalEggs: 0, totalCoins: 0, xp: 0,
    lv: { coop: 1, wash: 1, sort: 0, pack: 0, box: 0, auto: 0, feeder: 0, breed: 0 },
    acc: { wash: 0, sort: 0, pack: 0, box: 0, collect: 0, feeder: 0 }, hens: [],
  };
  for (let i = 0; i < 3; i++) s.hens.push(newHen(s));
  return s;
}
function flow(s, k, rate, dt, avail) {
  s.acc[k] = Math.min(s.acc[k] + dt * rate, avail + 1);
  const n = Math.min(Math.floor(s.acc[k]), avail);
  s.acc[k] -= n;
  return n;
}
function pickSize() {
  const r = Math.random();
  return r < SIZE_P.S ? "S" : r < SIZE_P.S + SIZE_P.M ? "M" : "L";
}
function tick(s, dt, ev) {
  ev = ev || (() => {});
  s.hens.forEach((hn, i) => {
    hn.h = Math.min(1, hn.h + dt / 90);
    if (hn.h > 0.4 && s.trough >= 1) { s.trough -= 1; hn.h = 0; ev("eat", i); }
    if (hn.h < 0.75) {
      hn.l -= dt;
      if (hn.l <= 0) {
        hn.l = layBase(s) * (0.8 + Math.random() * 0.4);
        if (s.nest < nestCap(s)) { s.nest++; ev("lay", i); }
      }
    }
  });
  if (s.lv.feeder > 0) {
    s.acc.feeder += dt;
    if (s.acc.feeder >= 5) {
      s.acc.feeder = 0;
      if (s.trough < troughCap(s) * 0.6 && s.feed > 0) {
        const f = Math.min(s.feed, troughCap(s) - s.trough, 8 + 4 * s.lv.feeder);
        s.trough += f; s.feed -= f; ev("feeder", f);
      }
    }
  }
  if (s.lv.auto > 0) {
    s.acc.collect += dt;
    if (s.acc.collect >= Math.max(1.5, 7 - 1.5 * s.lv.auto)) {
      s.acc.collect = 0;
      if (s.nest > 0) { s.basket += s.nest; ev("collect", s.nest); s.nest = 0; }
    }
  }
  const nw = flow(s, "wash", 0.4 + 0.4 * s.lv.wash, dt, s.basket);
  if (nw) {
    s.basket -= nw;
    for (let i = 0; i < nw; i++) { if (Math.random() < BREAK_RATE) { s.broken++; ev("broken", 1); } else s.clean++; }
    ev("wash", nw);
  }
  if (s.lv.sort > 0) {
    const n = flow(s, "sort", 0.4 + 0.4 * s.lv.sort, dt, s.clean);
    if (n) { s.clean -= n; for (let i = 0; i < n; i++) s.g[pickSize()]++; ev("sort", n); }
  }
  if (s.lv.pack > 0) {
    const sz = SIZES.filter((z) => s.g[z] >= 10).sort((a, b) => s.g[b] - s.g[a])[0];
    if (sz) {
      s.acc.pack += dt * (0.25 + 0.15 * s.lv.pack);
      if (s.acc.pack >= 1) { s.acc.pack -= 1; s.g[sz] -= 10; s.packs[sz]++; s.xp += 5; ev("pack", sz); }
    } else s.acc.pack = 0;
  }
  if (s.lv.box > 0) {
    const sz = SIZES.filter((z) => s.packs[z] >= 6).sort((a, b) => s.packs[b] - s.packs[a])[0];
    if (sz) {
      s.acc.box += dt * (0.2 + 0.1 * s.lv.box);
      if (s.acc.box >= 1) { s.acc.box -= 1; s.packs[sz] -= 6; s.cartons[sz]++; s.xp += 15; ev("box", sz); }
    } else s.acc.box = 0;
  }
}
const sum3 = (o) => o.S + o.M + o.L;
function sellValue(s) {
  let v = s.clean * PRICE.loose, eggs = s.clean;
  SIZES.forEach((z) => {
    v += s.g[z] * PRICE[z] + s.packs[z] * 10 * PACK_P[z] + s.cartons[z] * 60 * PACK_P[z] * CARTON_BONUS;
    eggs += s.g[z] + s.packs[z] * 10 + s.cartons[z] * 60;
  });
  return { coins: Math.round(v), eggs };
}
function sellAll(s) {
  const r = sellValue(s);
  if (!r.eggs) return null;
  s.clean = 0;
  SIZES.forEach((z) => { s.g[z] = 0; s.packs[z] = 0; s.cartons[z] = 0; });
  s.coins += r.coins; s.totalCoins += r.coins; s.totalEggs += r.eggs; s.xp += r.eggs;
  return r;
}
function collectEggs(s) { const n = s.nest; s.basket += n; s.nest = 0; return n; }
function feedTrough(s) {
  const n = Math.min(s.feed, troughCap(s) - s.trough);
  s.trough += n; s.feed -= n; return n;
}
function buyFeed(s) { if (s.coins < FEED_COST) return false; s.coins -= FEED_COST; s.feed += FEED_PACK; return true; }
const XP_TH = [0, 60, 180, 400, 800, 1400, 2300, 3600, 5500, 8000];
const farmLevel = (s) => XP_TH.filter((x) => s.xp >= x).length;
function levelProgress(s) {
  const L = farmLevel(s);
  if (L >= XP_TH.length) return { L, cur: s.xp, next: s.xp, p: 1 };
  const a = XP_TH[L - 1], b = XP_TH[L];
  return { L, cur: s.xp - a, next: b - a, p: (s.xp - a) / (b - a) };
}
const LEVEL_NOTE = {
  2: "Mở máy phân cỡ S/M/L", 3: "Mở máy đóng vỉ, chuồng lớn", 4: "Mở máy đóng thùng, rải cám, băng chuyền thu trứng",
  5: "Máy lên được thêm 1 cấp tốc độ", 6: "Máy lên được thêm 1 cấp tốc độ", 7: "Máy lên được thêm 1 cấp tốc độ",
  8: "Máy lên được thêm 1 cấp tốc độ", 9: "Máy lên được thêm 1 cấp tốc độ", 10: "Tất cả máy mở tối đa tốc độ",
};
const UNL = { wash: 1, sort: 2, pack: 3, box: 4, auto: 4, feeder: 4 }; // cấp trại mở máy
const f1 = (n) => (Math.round(n * 10) / 10).toString().replace(".", ",");
const SPEED = {
  wash: (l) => f1(0.4 + 0.4 * l) + " trứng/giây",
  sort: (l) => f1(0.4 + 0.4 * l) + " trứng/giây",
  pack: (l) => f1((0.25 + 0.15 * l) * 60) + " vỉ/phút",
  box: (l) => f1((0.2 + 0.1 * l) * 60) + " thùng/phút",
  auto: (l) => "thu mỗi " + f1(Math.max(1.5, 7 - 1.5 * l)) + " giây",
  feeder: (l) => "rải " + (8 + 4 * l) + " cám/lần",
  breed: (l) => "đẻ mỗi ~" + Math.round(26 * Math.pow(0.86, l)) + " giây",
};
function mach(id, name, baseCost, desc, cap) {
  return {
    id, name, desc, cap, kind: "machine", lvl: (s) => s.lv[id], cost: (s) => baseCost * (s.lv[id] + 1),
    need: (s) => UNL[id] + s.lv[id], speed: SPEED[id],
  };
}
const UPS = [
  { id: "hen", name: "🐔 Mua thêm gà", desc: "Mỗi con gà đẻ trứng theo giờ", kind: "farm", cap: 18, lvl: (s) => s.hens.length, limit: (s) => hensMax(s), cost: (s) => 40 + 12 * s.hens.length, need: () => 1, apply: (s) => s.hens.push(newHen(s)) },
  { id: "coop", name: "🏠 Mở rộng chuồng", desc: "Thêm chỗ cho gà, ổ trứng và máng ăn", kind: "farm", cap: 5, lvl: (s) => s.lv.coop, cost: (s) => 120 * s.lv.coop * s.lv.coop, need: (s) => 2 * s.lv.coop + 1 },
  { id: "breed", name: "🧬 Gà giống tốt", desc: "Gà đẻ nhanh hơn", kind: "farm", cap: 5, lvl: (s) => s.lv.breed, cost: (s) => 140 * (s.lv.breed + 1), need: (s) => s.lv.breed + 2, speed: SPEED.breed },
  mach("wash", "🚿 Máy rửa & soi trứng", 60, "Rửa nhanh hơn, loại trứng nứt", 5),
  mach("sort", "📏 Máy phân cỡ S/M/L", 90, "Phân cỡ trứng, giá cao hơn", 5),
  mach("pack", "📦 Máy đóng vỉ 10 quả", 160, "Đóng vỉ theo cỡ, dán nhãn MebiFarm", 5),
  mach("box", "🧰 Máy đóng thùng 6 vỉ", 260, "Thùng bán lời thêm 15%", 5),
  mach("auto", "🧺 Băng chuyền thu trứng", 120, "Tự thu trứng từ ổ về nhà máy", 3),
  mach("feeder", "🌾 Máy rải cám", 100, "Tự đổ cám từ kho ra máng", 3),
];
function upState(s, u) {
  const lv = u.lvl(s);
  if (lv >= u.cap) return { st: "max" };
  if (u.limit && lv >= u.limit(s)) return { st: "limit", why: "Cần mở rộng chuồng" };
  const need = u.need(s);
  if (farmLevel(s) < need) return { st: "lock", need };
  const c = u.cost(s);
  return { st: s.coins >= c ? "ok" : "poor", cost: c };
}
function buyUp(s, id) {
  const u = UPS.find((x) => x.id === id);
  if (!u) return false;
  const r = upState(s, u);
  if (r.st !== "ok") return false;
  s.coins -= r.cost;
  if (u.apply) u.apply(s); else s.lv[id]++;
  return true;
}
function simulateOffline(s, secs) {
  const before = { eggs: s.nest + s.basket + s.clean + sum3(s.g) + sum3(s.packs) * 10 + sum3(s.cartons) * 60 };
  secs = Math.min(secs, 4 * 3600);
  for (let t = 0; t < secs; t += 5) tick(s, 5, null);
  const after = s.nest + s.basket + s.clean + sum3(s.g) + sum3(s.packs) * 10 + sum3(s.cartons) * 60;
  return { secs, eggs: after - before.eggs };
}
// LOGIC_END =============================================================

// ---------- lưu trữ (đổi sang API server sau này bằng window.MebiFarmStore) ----------
const KEY = "mebifarm_v1";
const Store = window.MebiFarmStore || {
  load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } },
  save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} },
};
let S0 = Store.load();
if (!S0 || S0.v !== 1) S0 = newState();
const G = S0;
let offlineMsg = null;
{
  const gap = (Date.now() - (G.t0 || Date.now())) / 1000;
  if (gap > 30) offlineMsg = simulateOffline(G, gap);
}
if (G.xp == null) G.xp = G.totalEggs || 0;
G.t0 = Date.now();
const $ = (id) => document.getElementById(id);
const fmt = (n) => Math.round(n).toLocaleString("vi-VN");
function toast(t) {
  const el = $("toast");
  el.textContent = t; el.style.opacity = 1;
  clearTimeout(toast.t); toast.t = setTimeout(() => (el.style.opacity = 0), 2400);
}

// ---------- 3D ----------
const R = new THREE.WebGLRenderer({ antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2));
R.setSize(innerWidth, innerHeight);
document.body.prepend(R.domElement);
const S = new THREE.Scene();
S.background = new THREE.Color(0xdcc9a8);
S.fog = new THREE.Fog(0xdcc9a8, 70, 160);
const C = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 400);
S.add(new THREE.HemisphereLight(0xfff0dc, 0x7a6a52, 0.85));
const sun = new THREE.DirectionalLight(0xffd7a6, 0.75);
sun.position.set(-20, 26, 18);
S.add(sun);
const mat = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
const box = (w, h, d, c, x, y, z, par) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c));
  m.position.set(x, y, z); (par || S).add(m); return m;
};
const cyl = (r1, r2, h, c, x, y, z, par, seg) => {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg || 12), mat(c));
  m.position.set(x, y, z); (par || S).add(m); return m;
};
const sph = (r, c, x, y, z, par, sc) => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), mat(c));
  m.position.set(x, y, z); if (sc) m.scale.set(sc[0], sc[1], sc[2]); (par || S).add(m); return m;
};
function label(text, w, h, bg) {
  const c = document.createElement("canvas");
  c.width = 512; c.height = Math.round((512 * h) / w);
  const x = c.getContext("2d");
  x.fillStyle = bg || "rgba(110,28,22,.94)"; x.fillRect(0, 0, c.width, c.height);
  x.strokeStyle = "#e0b655"; x.lineWidth = 8; x.strokeRect(6, 6, c.width - 12, c.height - 12);
  x.fillStyle = "#ffe9b0"; x.font = "bold 64px system-ui,sans-serif";
  x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(text, c.width / 2, c.height / 2 + 4);
  const t = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, fog: false }));
  sp.scale.set(w, h, 1); sp.userData = { c, x, t, w, h }; return sp;
}
function relabel(sp, text, bg) {
  const { c, x, t } = sp.userData;
  x.clearRect(0, 0, c.width, c.height);
  x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height);
  x.strokeStyle = "#e0b655"; x.lineWidth = 8; x.strokeRect(6, 6, c.width - 12, c.height - 12);
  x.fillStyle = "#ffe9b0"; x.font = "bold 64px system-ui,sans-serif";
  x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(text, c.width / 2, c.height / 2 + 4);
  t.needsUpdate = true;
}
const clickables = [];
const act = (obj, name) => { obj.userData.act = name; clickables.push(obj); };

// nền
const ground = new THREE.Mesh(new THREE.CircleGeometry(120, 48), mat(0x7b8659));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; S.add(ground);
box(52, 0.1, 22, 0xa89870, 6, 0.0, 1, S); // nền sân đất
box(30, 0.12, 15, 0x6f8a4e, -10, 0.01, 2.5, S); // bãi cỏ chăn thả

// hàng rào bãi chăn
{
  const post = (x, z) => box(0.25, 1.1, 0.25, 0x6b431f, x, 0.55, z);
  const rail = (x, z, w, d) => box(w, 0.12, d, 0x8a5a2b, x, 0.8, z);
  for (let x = -24; x <= -3; x += 3) { post(x, 9.5); }
  for (let z = -4; z <= 9.5; z += 3.2) { post(-24, z); post(-2.5, z); }
  rail(-13.2, 9.5, 21.5, 0.1); rail(-24, 2.8, 0.1, 13.6); rail(-2.5, 2.8, 0.1, 13.6);
}

// chuồng gà
const coop = new THREE.Group();

const YARD = { x0: -22, x1: -4, z0: -3, z1: 8.2 };
const TROUGH_P = [-7, 5];
function updChick(c, i, dt, T) {
  const hasHen = i < G.hens.length;
  c.g.visible = hasHen;
  if (!hasHen) return;
  c.t -= dt;
  if (c.st === "walk") {
    const dx = c.tx - c.x, dz = c.tz - c.z, d = Math.hypot(dx, dz);
    if (d < 0.2) {
      if (c.goEat) { c.st = "eat"; c.t = 1.6; c.goEat = false; }
      else { c.st = "idle"; c.t = 0.6 + Math.random() * 2.2; }
    } else {
      const sp = 1.6 * dt;
      c.x += (dx / d) * sp; c.z += (dz / d) * sp;
      c.g.rotation.y = Math.atan2(dx, dz);
      c.g.position.y = Math.abs(Math.sin(T * 9 + c.ph)) * 0.08;
    }
  } else if (c.st === "idle") {
    c.g.position.y = 0;
    c.g.rotation.x = Math.sin(T * 5 + c.ph) > 0.8 ? 0.25 : 0;
    if (c.t <= 0) {
      c.g.rotation.x = 0; c.st = "walk";
      c.tx = YARD.x0 + Math.random() * (YARD.x1 - YARD.x0);
      c.tz = YARD.z0 + Math.random() * (YARD.z1 - YARD.z0);
    }
  } else if (c.st === "eat") {
    c.g.rotation.x = 0.35 + Math.sin(T * 14) * 0.18;
    if (c.t <= 0) { c.g.rotation.x = 0; c.st = "idle"; c.t = 0.5; }
  } else if (c.st === "lay") {
    c.g.scale.y = 0.85 * (0.85 + 0.15 * Math.sin(T * 20));
    if (c.t <= 0) { c.g.scale.y = 0.85; c.st = "idle"; c.t = 1; }
  }
  c.g.position.x = c.x; c.g.position.z = c.z;
}

function onEv(k, a) {

    c.tx = TROUGH_P[0] - 2 + Math.random() * 4; c.tz = TROUGH_P[1] - 1.2;

}

  tick(G, dt, onEv);
  chicks.forEach((c, i) => updChick(c, i, dt, T));
  for (let i = 0; i < nestEggs.length; i++) nestEggs[i].visible = i < G.nest;
  troughFeed.scale.x = Math.max(0.02, G.trough / troughCap(G));
  troughFeed.visible = G.trough >= 0.5;
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.t += dt;
    const u = Math.min(1, f.t / f.dur);
    f.m.position.lerpVectors(f.p0, f.p1, u); f.m.position.y += Math.sin(u * Math.PI) * f.arc;
    if (u >= 1) { S.remove(f.m); fx.splice(i, 1); }
  }
  for (let i = beltEggs.length - 1; i >= 0; i--) {
    const b = beltEggs[i]; b.x += 2.4 * dt; b.m.position.x = b.x;
    if (b.x > b.end) { S.remove(b.m); beltEggs.splice(i, 1); }
  }
  STN.forEach((st) => {
    const lv = G.lv[st.key], on = lv > 0, need = UNL[st.key];
    const txt = on ? st.name + " · Lv " + lv : farmLevel(G) < need ? "🔒 Cần cấp trại " + need : "🔓 " + st.name + " (chưa mở)";
    relabel(st.sign, txt, on ? "rgba(40,30,24,.92)" : "rgba(90,90,96,.92)");
    const col = new THREE.Color(on ? st.col : 0x8a8a90).lerp(new THREE.Color(0xffffff), Math.max(0, lv - 1) * 0.07);
    st.body.material.color.copy(col);
    st.lamp.material.color.setHex(on ? (Math.sin(T * (4 + lv * 2)) > 0 ? 0x4cd964 : 0x2f8f44) : 0xb33a3a);
    st.rotor.rotation.y += on ? dt * (1.5 + lv * 1.6) : 0;
    st.chim.visible = lv >= 3; st.trim.visible = lv >= 5; st.steam.visible = lv >= 3;
    if (st.steam.visible) {
      const u = (T * 0.7 + st.x) % 1;
      st.steam.position.y = 4.9 + u * 1.2; st.steam.scale.setScalar(0.7 + u * 0.8); st.steam.material.opacity = 0.7 * (1 - u);
    }
  });
  updTruck(dt);
  { const L = farmLevel(G); if (L > lastL) { lastL = L; toast("🎉 Trại lên cấp " + L + "! " + (LEVEL_NOTE[L] || "")); renderShop(); } }
  hudT += dt; saveT += dt;
  if (hudT > 0.25) { hudT = 0; hud(); }
  if (saveT > 5) { saveT = 0; G.t0 = Date.now(); Store.save(G); }
  tgt.lerp(tgtGoal, Math.min(1, dt * 3));
  C.position.set(tgt.x + Math.sin(yaw) * Math.cos(pitch) * dist, tgt.y + Math.sin(pitch) * dist, tgt.z + Math.cos(yaw) * Math.cos(pitch) * dist);
  C.lookAt(tgt);
  R.render(S, C);
  requestAnimationFrame(frame);
}
// STN label lưu trạng thái để không vẽ lại mỗi khung
{
  const orig = relabel; const cache = new WeakMap();
  window.relabel = null;
  relabel = (sp, text, bg) => { const k = text + bg; if (cache.get(sp) === k) return; cache.set(sp, k); orig(sp, text, bg); };
}
addEventListener("resize", () => { R.setSize(innerWidth, innerHeight); C.aspect = innerWidth / innerHeight; C.updateProjectionMatrix(); });
addEventListener("beforeunload", () => { G.t0 = Date.now(); Store.save(G); });
addEventListener("visibilitychange", () => { if (document.hidden) { G.t0 = Date.now(); Store.save(G); } });
hud();
if (offlineMsg && offlineMsg.eggs > 0) toast("🌙 Khi bạn vắng, trại làm thêm " + offlineMsg.eggs + " trứng");
else toast("🐔 Chào mừng đến MebiFarm");
requestAnimationFrame(frame);
</script>
