<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MebiFarm</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --o:#e8601f; --od:#a8400f; --br:#6b2c10; --cr:#fff3dc; --ye:#ffc94a; --gr:#7cc84e; --bg:#d9e8d0; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; overflow:hidden; font-family:"Baloo 2","Nunito",system-ui,sans-serif; color:var(--br); background:#a8e0f5; user-select:none; -webkit-user-select:none; }
  canvas { position:fixed; inset:0; display:block; touch-action:none; }
  .sk { background:var(--cr); border:3px solid var(--br); border-radius:18px; box-shadow:0 4px 0 var(--br); }
  #hud { position:fixed; z-index:10; top:calc(env(safe-area-inset-top,0px) + 8px); left:8px; display:flex; gap:8px; align-items:stretch; max-width:calc(100vw - 110px); }
  #hud .logo { width:66px; height:66px; border-radius:50%; padding:2px; background:#fff; flex:none; overflow:hidden; }
  #hud .logo img { width:100%; height:100%; object-fit:contain; display:block; }
  #stats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px 8px; padding:6px 10px; font-weight:800; font-size:13px; min-width:0; }
  .st { display:flex; flex-direction:column; gap:1px; min-width:0; }
  .st .row { display:flex; justify-content:space-between; gap:6px; white-space:nowrap; line-height:1.15; }
  .st .row small { font-weight:700; opacity:.65; font-size:11px; overflow:hidden; text-overflow:ellipsis; }
  .bar { height:9px; border-radius:6px; background:#e9d2ad; border:2px solid var(--br); overflow:hidden; }
  .bar i { display:block; height:100%; width:0; transition:width .3s; }
  #bLv { background:linear-gradient(90deg,#ffb23e,#ff7a2a); } #bFeed { background:#e0b030; } #bHen { background:var(--gr); } #bCoin { background:var(--ye); }
  .pop { animation:pop .35s; } @keyframes pop { 50% { transform:scale(1.18); } }
  #tools { position:fixed; z-index:11; top:calc(env(safe-area-inset-top,0px) + 8px); right:8px; display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  .rb { width:44px; height:44px; border-radius:50%; font-size:20px; cursor:pointer; padding:0; font-family:inherit; color:var(--br); }
  .rb:active { transform:translateY(2px); box-shadow:0 2px 0 var(--br); }
  #quest { position:fixed; z-index:10; top:calc(env(safe-area-inset-top,0px) + 86px); left:8px; max-width:210px; padding:6px 10px; font-size:12.5px; font-weight:700; line-height:1.25; }
  #quest b { color:var(--o); }
  #foc { position:fixed; z-index:10; top:calc(env(safe-area-inset-top,0px) + 150px); left:8px; display:flex; gap:5px; }
  #foc button { font:inherit; font-weight:800; font-size:12px; padding:3px 10px; border-radius:14px; cursor:pointer; color:var(--br); }
  #flow { position:fixed; z-index:10; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 84px); display:flex; gap:3px; align-items:center; padding:6px 8px; max-width:98vw; overflow-x:auto; }
  .stn { display:flex; flex-direction:column; align-items:center; min-width:52px; padding:3px 4px; border-radius:12px; font-weight:800; font-size:12px; line-height:1.1; border:2px solid transparent; }
  .stn span { font-size:20px; } .stn.off { opacity:.4; filter:grayscale(1); }
  .stn.warn { animation:blink .7s infinite; border-color:#d63a2a; } @keyframes blink { 50% { background:#ffc4b8; } }
  .arw { opacity:.45; font-weight:800; }
  #acts { position:fixed; z-index:10; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 10px); display:flex; gap:8px; }
  #acts button { font:inherit; font-weight:800; font-size:12.5px; width:74px; padding:5px 0 4px; border:3px solid var(--br); border-radius:18px; background:var(--o); color:#fff; box-shadow:0 5px 0 var(--br); cursor:pointer; display:flex; flex-direction:column; align-items:center; line-height:1.05; }
  #acts button span { font-size:24px; } #acts button.alt { background:var(--ye); color:var(--br); }
  #acts button:active:not(:disabled) { transform:translateY(3px); box-shadow:0 2px 0 var(--br); }
  #acts button:disabled { opacity:.5; }
  #pn { position:fixed; z-index:12; right:8px; top:calc(env(safe-area-inset-top,0px) + 110px); width:min(310px,94vw); max-height:calc(100vh - 290px); overflow-y:auto; padding:10px 12px; display:none; }
  #pn.open { display:block; animation:pop .25s; }
  #pn h4 { margin:0 0 6px; font-size:17px; display:flex; justify-content:space-between; align-items:center; }
  #pnX { width:28px; height:28px; font-size:14px; }
  .it { padding:7px 0; border-top:2px dashed #e2c89c; font-size:13px; font-weight:700; }
  .it small { display:block; font-weight:600; opacity:.75; font-size:11.5px; } .it .nm { display:flex; justify-content:space-between; gap:6px; }
  .pips { display:flex; gap:3px; margin:3px 0 5px; } .pips i { width:14px; height:8px; border-radius:4px; background:#e9d2ad; border:1.5px solid var(--br); } .pips i.on { background:var(--o); }
  .it button.up { font:inherit; font-weight:800; font-size:13px; width:100%; padding:4px 8px; border:2px solid var(--br); border-radius:12px; background:var(--gr); color:var(--br); box-shadow:0 3px 0 var(--br); cursor:pointer; }
  .it button.up:disabled { background:#d9c9aa; opacity:.8; cursor:default; box-shadow:0 3px 0 #a89870; }
  #toast { position:fixed; z-index:20; top:calc(env(safe-area-inset-top,0px) + 8px); left:50%; transform:translateX(-50%); opacity:0; transition:opacity .3s; pointer-events:none; padding:6px 14px; font-size:14px; font-weight:800; white-space:nowrap; max-width:60vw; overflow:hidden; text-overflow:ellipsis; }
  .coinfly { position:fixed; z-index:30; font-weight:800; font-size:22px; color:#fff; -webkit-text-stroke:1px var(--br); text-shadow:0 2px 0 var(--br); pointer-events:none; animation:fly 1.3s forwards; }
  @keyframes fly { to { transform:translateY(-90px); opacity:0; } }
  @media (max-width:560px) { #pn { top:auto; bottom:calc(env(safe-area-inset-bottom,0px) + 150px); right:50%; transform:translateX(50%); max-height:40vh; } #quest { top:calc(env(safe-area-inset-top,0px) + 86px); } }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }

  #bb { position:fixed; z-index:11; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 8px); width:min(720px,98vw); padding:6px 8px 8px; display:none; }
  body.building #bb { display:block; } body.building #acts, body.building #flow, body.building #quest { display:none; }
  #bb .hint { font-weight:800; font-size:13px; text-align:center; margin-bottom:5px; } #bb .row { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
  .pc { flex:none; width:84px; font:inherit; font-weight:800; font-size:12px; line-height:1.1; padding:5px 3px; border:3px solid var(--br); border-radius:14px; background:#fff; color:var(--br); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:1px; box-shadow:0 3px 0 var(--br); }
  .pc span { font-size:22px; } .pc small { font-size:11px; opacity:.8; } .pc.sel { background:var(--ye); transform:translateY(-3px); } .pc.done { background:var(--gr); } .pc:disabled { opacity:.45; cursor:default; }
  .rb.on { background:var(--ye); } .it button.up.red { background:#ff9a8a; } body.building #pn { top:calc(env(safe-area-inset-top,0px) + 8px); right:62px; max-height:calc(100vh - 190px); }
  @media (max-width:560px) { body.building #pn { top:calc(env(safe-area-inset-top,0px) + 80px); right:50%; bottom:auto; transform:translateX(50%); max-height:36vh; } }
  #bMerit { display:none; font:inherit; font-weight:800; font-size:14px; padding:4px 12px; border-radius:22px; cursor:pointer; color:var(--br); } #bMerit.show { display:block; }
</style>
</head>
<body>
<div id="hud">
  <div class="logo sk"><img id="logoImg" alt="MebiFarm - Real Farm, Real Food" /></div>
  <div id="stats" class="sk">
    <div class="st"><div class="row"><span>🪙 <b id="vCoins">0</b></span></div><div class="bar"><i id="bCoin" style="width:100%"></i></div></div>
    <div class="st"><div class="row"><span>⭐ Cấp <b id="vLv">1</b></span><small id="vXpT"></small></div><div class="bar"><i id="bLv"></i></div></div>
    <div class="st"><div class="row"><span>🌾 Kho <b id="vFeed">0</b></span><small id="vTr"></small></div><div class="bar"><i id="bFeed"></i></div></div>
    <div class="st"><div class="row"><span>🐔 <b id="vHens">0</b>/<span id="vMax">0</span></span></div><div class="bar"><i id="bHen"></i></div></div>
  </div>
</div>
<div id="tools"><button id="bBuild" class="rb sk" title="Xây dựng">🔧</button><button id="bTemple" class="rb sk" title="Về chùa MEBI">🏯</button><button id="bMerit" class="sk" title="Công đức">🪷 <b id="vMerit">0</b></button></div>
<div id="quest" class="sk"></div>
<div id="pn" class="sk"></div>
<div id="flow" class="sk"></div>
<div id="acts">
  <button id="bFeedA"><span>🌾</span>Rải cám</button><button id="bBuyFeed" class="alt"><span>🛒</span>Mua cám</button><button id="bCollect"><span>🧺</span>Thu trứng</button><button id="bSell" class="alt"><span>🚚</span>Bán hàng</button>
</div>
<div id="bb" class="sk"></div>
<div id="toast" class="sk"></div>

  pHtml = ""; renderPn(); };
function doAct(a) {
  const [k, x, y] = a.split(":");
  if (k === "cell") { if (placing) { const m = tryPlace(G, placing, +x, +y); if (m) toast(m); else { toast("✔ Đã đặt " + DEF[placing].n); placing = null; refreshGrid(); renderBB(); } } else { linking = null; closePn(); renderBB(); } }
  else if (k === "node") { pk = { t: "node", id: +x }; pHtml = ""; renderPn(); }
  else if (k === "out") { if (!build) { pk = { t: "node", id: +x }; pHtml = ""; return renderPn(); } linking = { id: +x, p: +y }; placing = null; toast("Chạm cổng vào (xanh) của máy đích"); renderBB(); }
  else if (k === "in") { if (build && linking) { const m = linkNodes(G, linking.id, linking.p, +x); toast(m || "🔗 Đã nối băng chuyền"); linking = null; renderBB(); } else if (!build) { pk = { t: "node", id: +x }; pHtml = ""; renderPn(); } else toast("Chạm cổng ra (cam) của máy trước rồi mới chọn cổng này"); }
  else if (k === "belt") { if (build) { pk = { t: "belt", id: +x }; pHtml = ""; renderPn(); } }
  else if (k === "collect") actCollect(); else if (k === "buyfeed") actBuyFeed(); else if (k === "temple") location.href = TEMPLE_URL;

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let down = null, drag = null;
const vis = (o) => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
R.domElement.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; drag = { x: e.clientX, y: e.clientY }; });
addEventListener("pointerup", () => (drag = null));
addEventListener("pointermove", (e) => { if (!drag || build) return; cg.yaw -= (e.clientX - drag.x) * 0.006; cg.pitch = Math.max(0.25, Math.min(1.25, cg.pitch + (e.clientY - drag.y) * 0.004)); drag = { x: e.clientX, y: e.clientY }; });
addEventListener("wheel", (e) => { cg.dist = Math.max(18, Math.min(70, cg.dist + e.deltaY * 0.03)); }, { passive: true });
R.domElement.addEventListener("pointerup", (e) => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6 || performance.now() - down.t > 500) return;
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(mouse, C);
  for (const h of ray.intersectObjects(S.children, true)) { if (!vis(h.object)) continue; let o = h.object; while (o && !o.userData.act) o = o.parent; if (o && vis(o)) return doAct(o.userData.act); }
});
// ---------- thao tác nhanh ----------
function actCollect() { const n = collectEggs(G); toast(n ? "🧺 Thu " + n + " trứng từ chuồng chưa nối băng" : "Không có trứng để thu (chuồng nối băng chuyền tự chạy)"); }
function actFeed() { const n = feedTrough(G); toast(n ? "🌾 Rải " + n + " cám ra máng" : G.feed ? "Máng đã đầy" : "Kho cám trống, hãy mua thêm"); }
function actBuyFeed() { toast(buyFeed(G) ? "🛒 Mua " + FEED_PACK + " cám (-" + FEED_COST + " xu)" : "Không đủ xu"); }
function coinFly(t, x, y) { const d = document.createElement("div"); d.className = "coinfly"; d.textContent = t; d.style.left = x + "px"; d.style.top = y + "px"; document.body.appendChild(d); setTimeout(() => d.remove(), 1300); }
function actSell() { const r = sellStock(G); if (!r) return toast("Kho tay đang trống. Máy nối bến giao tự bán"); const b = $("bSell").getBoundingClientRect(); coinFly("+" + fmt(r.coins) + " 🪙", b.left, b.top - 10); toast("🚚 Bán " + fmt(r.eggs) + " trứng"); }
$("bCollect").onclick = actCollect; $("bFeedA").onclick = actFeed; $("bBuyFeed").onclick = actBuyFeed; $("bSell").onclick = actSell; $("bTemple").onclick = () => (location.href = TEMPLE_URL); $("bBuild").onclick = () => setBuild(!build); $("bMerit").onclick = () => { pk = { t: "merit" }; pHtml = ""; renderPn(); };

// ---------- công đức: chỉ TIÊU điểm (server chỉ cho phép trừ từ trình duyệt) ----------
let mWired = false, mBusy = false;
const mmss = (ms) => Math.floor(ms / 60000) + ":" + String(Math.floor(ms / 1000) % 60).padStart(2, "0");
const extend = (k) => { G.buff = G.buff || { lay: 0, price: 0 }; G.buff[k] = Math.min(Date.now() + 1800000, Math.max(Date.now(), G.buff[k] || 0) + 300000); };
const MO = [
  { id: "xu", ic: "🪙", n: "Túi xu", cost: 10, d: () => "+" + fmt(50 * farmLevel(G)) + " xu (theo cấp trại)", apply: () => { const x = 50 * farmLevel(G); G.coins += x; return "+" + fmt(x) + " xu"; } },
  { id: "feed", ic: "🌾", n: "Bao cám phúc lộc", cost: 5, d: () => "+100 cám vào kho", apply: () => { G.feed += 100; return "+100 cám"; } },
  { id: "lay", ic: "✨", n: "Phúc lộc đẻ trứng", cost: 15, d: () => "Gà đẻ nhanh gấp đôi trong 5 phút", apply: () => { extend("lay"); return "Gà đẻ nhanh 5 phút"; } },
  { id: "price", ic: "💰", n: "Lộc buôn bán", cost: 25, d: () => "Giá bán ×1,5 trong 5 phút", apply: () => { extend("price"); return "Giá bán ×1,5 trong 5 phút"; } },
];
function wireMerit() { mWired = true; const M = window.MebiMerit; M.ready.then(refreshMerit).catch(() => {}); addEventListener("mebi-merit-change", refreshMerit); }
function refreshMerit() { const b = $("bMerit"); b.classList.toggle("show", mWired); if (mWired) $("vMerit").textContent = fmt(window.MebiMerit.get()); }
function buffTxt() { const n = Date.now(), b = G.buff || {}; return (b.lay > n ? "✨ Đẻ nhanh " + mmss(b.lay - n) + "<br>" : "") + (b.price > n ? "💰 Giá ×1,5 " + mmss(b.price - n) + "<br>" : ""); }
function meritHtml() {
  const M = window.MebiMerit, bal = M ? M.get() : 0, debt = M && M.getDebt ? M.getDebt() : 0;
  let h = '<h4><span>🪷 Công đức</span><button class="rb sk" data-a="x" id="pnX">✕</button></h4><div class="it"><div class="nm"><span>Số dư</span><span>' + fmt(bal) + " 🪷</span></div><small>" + (debt ? "Đang nợ " + fmt(debt) + " công đức. " : "") + "Làm công đức ở Chùa Mebi để có thêm.</small>" + btn("🏯 Sang Chùa Mebi", "tp:", 0) + "</div>";
  MO.forEach((o) => { h += '<div class="it"><div class="nm"><span>' + o.ic + " " + o.n + "</span><span>" + o.cost + " 🪷</span></div><small>" + o.d() + "</small>" + btn(bal >= o.cost ? "Đổi" : "Thiếu " + (o.cost - bal) + " 🪷", "m:" + o.id, bal < o.cost || mBusy) + "</div>"; });
  return h;
}
async function buyMerit(id) {
  const o = MO.find((x) => x.id === id), M = window.MebiMerit; if (!o || !M || mBusy) return; mBusy = true; pHtml = ""; renderPn();
  try {
    await M.ready;
    const r = await fetch("/api/merit", { credentials: "same-origin", cache: "no-store" }); const before = (await r.json()).balance; // số dư thật từ server
    if (before < o.cost) throw new Error("Không đủ công đức");
    const after = await M.change(-o.cost);
    if (before - after < o.cost) throw new Error("Công đức vừa thay đổi, hãy thử lại"); // server đã kẹp về 0 nên không trao vật phẩm
    const msg = o.apply(); G.t0 = Date.now(); Store.save(G); toast("🪷 -" + o.cost + " · " + msg);
  } catch (e) { toast("⚠ " + (e.message || "Không dùng được công đức")); }
  mBusy = false; pHtml = ""; renderPn();
}
// ---------- HUD ----------
const QS = [
  ["Thu trứng bằng tay rồi bán 20 trứng", () => G.totalEggs >= 20, () => G.totalEggs + "/20"], ["Mua thêm gà cho chuồng (bấm vào chuồng)", () => hensAll(G) >= 6, () => hensAll(G) + "/6"],
  ["Lên cấp trại 2 và đặt máy phân cỡ giữa máy rửa và bến giao (🔧)", () => cnt(G, "sort") > 0, () => "cấp trại " + farmLevel(G)], ["Mở rộng đất trong chế độ 🔧", () => G.land >= 2, () => "cần " + fmt(landCost(G)) + " xu"],
  ["Đặt máy đóng vỉ, nối trọn dây chuyền", () => cnt(G, "pack") > 0, () => "cấp trại " + farmLevel(G)], ["Đóng 1 thùng trứng", () => G.boxes > 0, () => "cần máy đóng thùng"], ["Đặt chuồng thứ hai", () => cnt(G, "coop") >= 2, () => "cấp trại 3"],
];
function renderQuest() { const i = QS.findIndex((q) => !q[1]()); $("quest").innerHTML = buffTxt() + (i < 0 ? "🏆 <b>Hoàn thành nhiệm vụ!</b>" : "📋 Nhiệm vụ " + (i + 1) + "/" + QS.length + "<br><b>" + QS[i][0] + "</b> (" + QS[i][2]() + ")"); }
function renderFlow() {
  $("flow").innerHTML = Object.keys(DEF).map((t) => { const ns = G.nodes.filter((n) => n.t === t), q = ns.reduce((a, n) => a + (t === "coop" ? tot(n.o[0]) : tot(n.q)), 0);
    return '<div class="stn' + (ns.length ? "" : " off") + (ns.some((n) => n.blk) ? " warn" : "") + '"><span>' + DEF[t].ic + "</span>" + (ns.length ? q : "–") + "</div>"; }).join('<b class="arw">›</b>') + '<div class="stn"><span>🧺</span>' + tot(G.stock) + "</div>";
}
function hud() {
  if (!mWired && window.MebiMerit) wireMerit(); refreshMerit();
  $("vCoins").textContent = fmt(G.coins); $("vFeed").textContent = fmt(G.feed); $("vHens").textContent = hensAll(G); $("vMax").textContent = hensTotalCap(G);
  $("vTr").textContent = "máng " + Math.round(G.trough) + "/" + troughCap(G); $("bFeed").style.width = (100 * G.trough / troughCap(G)) + "%"; $("bHen").style.width = (100 * hensAll(G) / Math.max(1, hensTotalCap(G))) + "%";
  const lp = levelProgress(G); $("vLv").textContent = lp.L; $("bLv").style.width = Math.round(lp.p * 100) + "%"; $("vXpT").textContent = lp.L >= XP_TH.length ? "tối đa" : lp.cur + "/" + lp.next;
  renderFlow(); renderQuest(); renderPn(); renderBB(); refreshGrid();
  $("bBuyFeed").disabled = G.coins < FEED_COST; $("bCollect").lastChild.textContent = "Thu trứng";
}
// ---------- vòng lặp ----------
let last = performance.now(), hudT = 0, saveT = 0, TM = 0, lastL = farmLevel(G); const tgt = new THREE.Vector3(0, 0, 0), pulse = new THREE.Color();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now; TM += dt;
  tick(G, dt, onEv); sync();
  G.nodes.forEach((n) => { n.w = Math.max(0, n.w - dt); const v = views[n.id]; if (v) { v.anim(dt, TM); v.ports.forEach((p, i) => { const s = build ? 1.3 + (linking && p.userData.act.startsWith("in:") ? 0.25 * Math.sin(TM * 8) : 0) : 0.8; p.scale.setScalar(s); }); } });
  G.edges.forEach((e) => { e.on = Math.max(0, (e.on || 0) - dt); const v = eviews[e.id]; if (v) animEdge(v, e, TM); });
  clouds.forEach((c, i) => { c.position.x += dt * (0.8 + i * 0.1); if (c.position.x > 90) c.position.x = -90; });
  for (let i = fx.length - 1; i >= 0; i--) { const f = fx[i]; f.t += dt; const u = Math.min(1, f.t / f.dur); f.m.position.lerpVectors(f.p0, f.p1, u); f.m.position.y += Math.sin(u * Math.PI) * 2.2; if (u >= 1) { S.remove(f.m); fx.splice(i, 1); } }
  { const L = farmLevel(G); if (L > lastL) { lastL = L; toast("🎉 Trại lên cấp " + L + "! " + (LEVEL_NOTE[L] || "Máy nâng được thêm cấp")); renderBB(); } }
  hudT += dt; saveT += dt; if (hudT > 0.25) { hudT = 0; hud(); } if (saveT > 5) { saveT = 0; G.t0 = Date.now(); Store.save(G); }
  const k = Math.min(1, dt * 4); cam.yaw += (cg.yaw - cam.yaw) * k; cam.pitch += (cg.pitch - cam.pitch) * k; cam.dist += (cg.dist - cam.dist) * k;
  C.position.set(tgt.x + Math.sin(cam.yaw) * Math.cos(cam.pitch) * cam.dist, tgt.y + Math.sin(cam.pitch) * cam.dist, tgt.z + Math.cos(cam.yaw) * Math.cos(cam.pitch) * cam.dist); C.lookAt(tgt);
  R.render(S, C); requestAnimationFrame(frame);
}
addEventListener("resize", () => { R.setSize(innerWidth, innerHeight); C.aspect = innerWidth / innerHeight; C.updateProjectionMatrix(); });
addEventListener("beforeunload", () => { G.t0 = Date.now(); Store.save(G); });
addEventListener("visibilitychange", () => { if (document.hidden) { G.t0 = Date.now(); Store.save(G); } });
cg.dist = cam.dist = fitDist(46);
sync(); refreshGrid(); hud();
if (offlineMsg && offlineMsg.eggs > 0) toast("🌙 Khi bạn vắng, trại làm thêm " + offlineMsg.eggs + " trứng"); else toast("🐔 Chào mừng đến MebiFarm");
requestAnimationFrame(frame);

</script>
