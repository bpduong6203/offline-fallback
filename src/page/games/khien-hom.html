<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khiêng Hòm</title>
<style>
:root{--bg:#161126;--fg:#f4ead5;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161126;--fg:#f4ead5}}
:root[data-theme="dark"]{--bg:#161126;--fg:#f4ead5}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:8px;box-sizing:border-box}
canvas{width:min(100%,960px);aspect-ratio:960/440;display:block;border-radius:6px}
p{margin:0;font-size:14px;line-height:1.5;text-align:center;max-width:760px}
b{color:#ffd36b}
</style></head><body>
<canvas id="c"></canvas>
<p><b>Người đi trước:</b> W nhảy, S khom. <b>Người đi sau:</b> ↑ nhảy, ↓ khom. Chắn ngang thấp thì nhảy, xà treo cao thì khom. Giữ hòm cân bằng để người nằm trong không trượt ra ngoài.</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=960,HH=440;c.width=W;c.height=HH;
const L=120,H=118,HL=85,keys={};let S,mode='ready',best=0,last=0;
const amp=w=>1+Math.min(1,Math.max(0,w-800)/4000);
const g=w=>320+amp(w)*(26*Math.sin(w/260)+16*Math.sin(w/97+1.3));
const mk=()=>({off:0,vy:0,hf:1,st:0});
function reset(){S={xf:200,t:0,p:0,v:0,b:[mk(),mk()],obs:[],nx:900,slow:0,ph:0,flash:0}}
reset();
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','Enter'].includes(e.code))e.preventDefault();
  if(e.repeat)return;keys[e.code]=1;
  if(mode!=='play'){if(e.code==='Space'||e.code==='Enter'){reset();mode='play'}return}
  const j={KeyW:0,ArrowUp:1}[e.code];
  if(j!==undefined){const b=S.b[j];if(b.off===0&&b.vy===0&&b.st<=0)b.vy=380}
});
addEventListener('keyup',e=>keys[e.code]=0);
function upd(dt){
  S.t+=dt;S.slow=Math.max(0,S.slow-dt);S.flash=Math.max(0,S.flash-dt);
  const sp=(150+Math.min(90,S.xf/40))*(S.slow>0?.5:1);
  S.xf+=sp*dt;S.ph+=sp*dt/14;
  while(S.nx<S.xf+1200){S.obs.push({x:S.nx,t:Math.random()<.5?'low':'high',hit:[0,0]});S.nx+=430+Math.random()*280}
  S.obs=S.obs.filter(o=>o.x>S.xf-400);
  const xs=[S.xf,S.xf-L];
  S.b.forEach((b,i)=>{
    const cr=keys[i?'ArrowDown':'KeyS']&&b.off===0&&b.st<=0;
    b.hf+=((cr?.55:1)-b.hf)*Math.min(1,dt*14);b.st=Math.max(0,b.st-dt);
    if(b.off>0||b.vy>0){b.vy-=1100*dt;b.off+=b.vy*dt;if(b.off<=0){b.off=0;b.vy=0;S.v+=(Math.random()-.5)*120}}
    for(const o of S.obs){
      if(o.hit[i]||Math.abs(xs[i]-o.x)>10)continue;
      const top=b.off+H*b.hf*.84+22;
      if(o.t==='low'?b.off<34:top>100){o.hit[i]=1;b.st=.5;S.slow=.5;S.flash=.25;S.v-=240}
    }
  });
  const[f,r]=S.b,yf=g(xs[0])-f.off-H*f.hf*.84-12,yr=g(xs[1])-r.off-H*r.hf*.84-12;
  const s=Math.sin(Math.atan2(yf-yr,L));
  S.v+=900*(Math.abs(s)>.1?s-Math.sign(s)*.1:0)*dt;
  S.v*=Math.max(0,1-2*dt);S.p+=S.v*dt;
  if(Math.abs(S.p)>HL-8){mode='over';best=Math.max(best,(S.xf-200)/20)}
  return{xs,yf,yr}
}
function headV(hx,hy,fr,b){
  const d=fr?1:-1,hurt=b.st>0,sk=hurt?'#e6b3ad':'#cfd9e4';
  x.strokeStyle=sk;x.lineWidth=4;x.lineCap='round';x.beginPath();x.moveTo(hx-d*2,hy+8);x.lineTo(hx-d*3,hy+15);x.stroke();
  x.fillStyle=sk;x.beginPath();x.ellipse(hx,hy,7.5,10.5,0,0,7);x.fill();
  x.fillStyle='#aeb9c8';x.beginPath();x.ellipse(hx-d*7,hy+1,2,3.2,0,0,7);x.fill();
  x.fillStyle='rgba(70,100,140,.25)';x.beginPath();x.ellipse(hx+d*2,hy+6,3.6,2.6,0,0,7);x.fill();
  x.fillStyle='#0b0b10';x.beginPath();x.moveTo(hx-9,hy+3);x.quadraticCurveTo(hx-13,hy-12,hx-3,hy-15);x.quadraticCurveTo(hx+3,hy-19,hx+8,hy-12);x.quadraticCurveTo(hx+12,hy-6,hx+8,hy+1);x.quadraticCurveTo(hx+d*9,hy-8,hx+d*2,hy-6);x.quadraticCurveTo(hx-4,hy-10,hx-9,hy+3);x.fill();
  x.beginPath();x.moveTo(hx-2,hy-14);x.lineTo(hx-7,hy-22);x.lineTo(hx+3,hy-15);x.moveTo(hx+3,hy-15);x.lineTo(hx+2,hy-23);x.lineTo(hx+7,hy-13);x.fill();
  for(const e of[-3,4.5]){const ex=hx+e+d*1.5;
    x.fillStyle='#3a4150';x.beginPath();x.ellipse(ex,hy+1,5.2,5.6,0,0,7);x.fill();
    x.fillStyle='#fff';x.beginPath();x.arc(ex,hy+1,4.1,0,7);x.fill();
    x.fillStyle='#0a0a0f';x.beginPath();x.arc(ex+d*1.4,hy+1.4,hurt?.9:1.5,0,7);x.fill();
    x.fillStyle='#fff';x.beginPath();x.arc(ex+d*.6,hy+.6,.5,0,7);x.fill();
    x.strokeStyle='#0b0b10';x.lineWidth=1.3;x.beginPath();if(e<0){x.moveTo(ex-3,hy-4.5);x.lineTo(ex+3,hy-7)}else{x.moveTo(ex-3,hy-7);x.lineTo(ex+3,hy-4.5)}x.stroke()}
  x.strokeStyle='#8c9bb0';x.lineWidth=1;x.beginPath();x.moveTo(hx+d*5,hy+2);x.lineTo(hx+d*7.5,hy+5.5);x.lineTo(hx+d*5,hy+6);x.stroke();
  x.strokeStyle='#5b6578';x.lineWidth=1.3;x.beginPath();
  if(hurt){x.ellipse(hx+d*2.5,hy+9,2,2.6,0,0,7)}else{x.moveTo(hx+d,hy+8.5);x.quadraticCurveTo(hx+d*3,hy+7.3,hx+d*5,hy+8.8)}
  x.stroke()
}
function headV0(hx,hy,fr,b){
  const d=fr?1:-1;
  x.fillStyle=b.st>0?'#e6b3ad':'#cfd9e4';x.beginPath();x.ellipse(hx,hy,8,10.5,0,0,7);x.fill();
  x.fillStyle='#0b0b10';x.beginPath();x.moveTo(hx-9,hy+1);x.quadraticCurveTo(hx-11,hy-15,hx+1,hy-14);x.quadraticCurveTo(hx+11,hy-14,hx+9,hy-2);x.quadraticCurveTo(hx+d*8,hy-9,hx+d,hy-5);x.quadraticCurveTo(hx-4,hy-9,hx-9,hy+1);x.fill();
  for(const e of[-2.5,4]){const ex=hx+e+d*1.5;x.fillStyle='#2b2f3d';x.beginPath();x.arc(ex,hy+1,4.6,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(ex,hy+1,3.6,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(ex+d*1.2,hy+1.2,1.3,0,7);x.fill()}
  x.strokeStyle='#5b6578';x.lineWidth=1.2;x.beginPath();x.moveTo(hx+d-2,hy+8);x.lineTo(hx+d+2,hy+8.5);x.stroke()
}
function fig(sx,gy,b,front,cy,ph){
  const hip=gy-b.off-H*b.hf*.5,sh=gy-b.off-H*b.hf*.84,lean=front?5:-3,hurt=b.st>0,dark=hurt?'#5a1e25':'#17171f',rim=hurt?'#ff7a6b':'#5a86b5',coat=hurt?'#4a2226':'#2c2123',sw=Math.sin(ph)*3;
  const seg=(ax,ay,bx,by,w,c)=>{x.strokeStyle=c;x.lineWidth=w;x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke()};
  x.lineCap=x.lineJoin='round';
  for(const k of[1,0]){
    const a=ph+k*Math.PI;let fx=sx+Math.sin(a)*16,fy=gy-b.off-Math.max(0,Math.cos(a))*8;
    if(b.off>0){fx=sx+(k?-7:7);fy=hip+26}
    const kx=(sx+fx)/2+(b.hf<.8?16:7),ky=(hip+fy)/2;
    seg(sx,hip,kx,ky,6.5,rim);seg(kx,ky,fx,fy,5.5,rim);seg(sx,hip,kx,ky,4.5,dark);seg(kx,ky,fx,fy,3.5,dark);
    seg(sx,hip,kx,ky,.8,'#6b7088');seg(kx,ky,fx,fy,.8,'#6b7088');
    x.fillStyle='#0c0c12';x.strokeStyle=rim;x.lineWidth=1;x.beginPath();x.ellipse(fx+4,fy-1,6,2.6,0,0,7);x.fill();x.stroke()
  }
  x.beginPath();x.moveTo(sx+lean-6,sh);x.lineTo(sx+lean+6,sh);x.lineTo(sx+6,hip+4);x.lineTo(sx+8+sw*.4,hip+28);x.lineTo(sx+1,hip+21);x.lineTo(sx-9+sw*.4,hip+28);x.lineTo(sx-5,hip+4);x.closePath();
  x.fillStyle=coat;x.fill();x.strokeStyle=rim;x.lineWidth=1.5;x.stroke();
  x.fillStyle='#e4e9ef';x.beginPath();x.moveTo(sx+lean-2,sh+1);x.lineTo(sx+lean+3,sh+1);x.lineTo(sx+lean+1,sh+17);x.closePath();x.fill();
  x.fillStyle='#3d2f31';x.beginPath();x.moveTo(sx+lean-6,sh);x.lineTo(sx+lean-1,sh+1);x.lineTo(sx+lean-3,sh+15);x.closePath();x.fill();x.beginPath();x.moveTo(sx+lean+6,sh);x.lineTo(sx+lean+1,sh+1);x.lineTo(sx+lean+3,sh+15);x.closePath();x.fill();
  x.fillStyle='#9aa3ad';x.beginPath();x.moveTo(sx+lean-4,sh-1);x.lineTo(sx+lean+5,sh-1);x.lineTo(sx+lean+1,sh+10);x.closePath();x.fill();
  x.fillStyle='#8a766b';for(let k=0;k<3;k++){x.beginPath();x.arc(sx+lean*.4,sh+16+k*6,1.1,0,7);x.fill()}
  const ex=sx+lean+(front?12:-12),ey=sh+13,hx=sx+lean+(front?4:-4),hy=cy+10;
  seg(sx+lean,sh+2,ex,ey,6,rim);seg(ex,ey,hx,hy,6,rim);seg(sx+lean,sh+2,ex,ey,4,coat);seg(ex,ey,hx,hy,4,coat);
  x.fillStyle='#e4e9ef';x.beginPath();x.arc(hx,hy-2.5,2.6,0,7);x.fill();
  x.fillStyle='#cfd9e4';x.strokeStyle='#8c9bb0';x.lineWidth=.8;x.beginPath();x.ellipse(hx,hy+1,3.6,2.8,0,0,7);x.fill();x.stroke();
  seg(hx-2,hy+3,hx-2,hy+5,1,'#cfd9e4');seg(hx,hy+3,hx,hy+5.5,1,'#cfd9e4');seg(hx+2,hy+3,hx+2,hy+5,1,'#cfd9e4')
}
function bride(){
  const t=S.t,sw=Math.sin(t*7)*Math.min(6,Math.abs(S.v)/25)+Math.sin(t*3)*1.5,sc=Math.abs(S.p)>HL*.55;
  x.shadowColor='#7fc8ff';x.shadowBlur=12;
  x.fillStyle='rgba(190,225,255,.28)';x.beginPath();x.moveTo(18,-12);x.quadraticCurveTo(-10,-30+sw,-52,-18+sw*1.5);x.quadraticCurveTo(-56,-2,-48,14+sw);x.quadraticCurveTo(-10,10,12,4);x.closePath();x.fill();
  x.strokeStyle='rgba(220,240,255,.5)';x.lineWidth=1;x.beginPath();x.moveTo(10,-14);x.quadraticCurveTo(-20,-22+sw,-50,-8+sw);x.stroke();
  x.strokeStyle='#dfe8f0';x.lineWidth=2.2;x.lineCap='round';x.beginPath();x.moveTo(-46,6);x.lineTo(-60,10+sw*.3);x.lineTo(-64,6);x.moveTo(-60,10+sw*.3);x.lineTo(-65,12);x.stroke();
  x.fillStyle='#6f98c6';x.strokeStyle='#3f6693';x.lineWidth=1.2;x.beginPath();
  [[-4,-9],[-4,6],[-26,11],[-46,15],[-42,8],[-50,5],[-44,-1],[-52,-4],[-44,-9],[-46,-15],[-30,-13],[-10,-12]].forEach((p,i)=>x[i?'lineTo':'moveTo'](p[0],p[1]));
  x.closePath();x.fill();x.stroke();
  x.strokeStyle='#4f78a8';x.beginPath();x.moveTo(-8,-5);x.lineTo(-44,-9);x.moveTo(-8,0);x.lineTo(-46,5);x.moveTo(-8,4);x.lineTo(-40,12);x.stroke();
  x.strokeStyle='#a9c8e8';x.beginPath();x.moveTo(-46,15);x.lineTo(-42,8);x.lineTo(-50,5);x.lineTo(-44,-1);x.stroke();
  x.fillStyle='#86aed6';x.beginPath();x.moveTo(-6,-10);x.lineTo(10,-12);x.lineTo(12,2);x.lineTo(-6,4);x.closePath();x.fill();x.strokeStyle='#5d84b1';x.lineWidth=1;
  x.beginPath();for(let k=0;k<3;k++){x.moveTo(1+k*3,-8);x.lineTo(1+k*3,0)}x.stroke();
  x.strokeStyle='#7fa6cf';x.lineWidth=3.5;x.beginPath();x.moveTo(6,2);x.lineTo(4+sw*.4,12);x.lineTo(2+sw*.8,22);x.stroke();
  x.fillStyle='#9cc3e2';x.beginPath();x.arc(2+sw*.8,23,2.6,0,7);x.fill();
  x.strokeStyle='#7fa6cf';x.beginPath();x.moveTo(10,-10);x.lineTo(2,-9);x.lineTo(6,-13);x.stroke();
  [['#5b7fcf',0,-16],['#c9d9ff',4,-18],['#4a66b0',-3,-18],['#9db8f0',2,-20]].forEach(f=>{x.fillStyle=f[0];x.beginPath();x.arc(2+f[1],f[2],3,0,7);x.fill()});
  x.save();x.translate(22,-5);x.rotate(Math.PI/2);
  x.strokeStyle='#0f1a3a';x.lineWidth=5;x.beginPath();x.moveTo(5,0);x.quadraticCurveTo(11,14+sw,5,30+sw*1.5);x.moveTo(1,2);x.quadraticCurveTo(6,16+sw,0,32+sw*1.5);x.moveTo(8,-2);x.quadraticCurveTo(14,10+sw,10,26+sw);x.stroke();
  x.fillStyle='#8fb4d8';x.beginPath();x.ellipse(0,0,9,10.5,0,0,7);x.fill();
  x.fillStyle='#0f1a3a';x.beginPath();x.ellipse(2.5,-3,8,8,0,0,7);x.fill();
  x.fillStyle='#cfe3ff';[[-2,-9],[3,-10],[7,-7]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],1.4,0,7);x.fill()});
  const er=sc?4.8:4.1;
  x.fillStyle='#26335a';x.beginPath();x.ellipse(-3.5,-1,er+1.4,er+1.8,0,0,7);x.fill();
  x.fillStyle='#fff';x.beginPath();x.ellipse(-3.5,-1,er,er+.6,0,0,7);x.fill();
  x.fillStyle='#0a0f22';x.beginPath();x.arc(-5,-.5,sc?1.2:1.8,0,7);x.fill();
  x.strokeStyle='#0f1a3a';x.lineWidth=1.2;x.beginPath();x.moveTo(-5,-6.5);x.quadraticCurveTo(-3,-8.5,0,-7.5);x.moveTo(-7,-3.5);x.lineTo(-9,-5);x.stroke();
  x.strokeStyle='#6f93b8';x.beginPath();x.moveTo(-8.5,1);x.lineTo(-11,3.5);x.lineTo(-8.5,5);x.stroke();
  x.strokeStyle='#7a6bb0';x.lineWidth=1.8;x.beginPath();if(sc){x.ellipse(-6,7.5,1.8,2.4,0,0,7)}else{x.moveTo(-8,7.5);x.quadraticCurveTo(-6,8.6,-4,7.5)}x.stroke();
  x.restore()
}
function fig3(sx,gy,b,front,cy,ph){
  const hip=gy-b.off-H*b.hf*.5,sh=gy-b.off-H*b.hf*.84,lean=front?5:-3,hurt=b.st>0,dark=hurt?'#5a1e25':'#17171f',rim=hurt?'#ff7a6b':'#5a86b5';
  const limbs=()=>{x.beginPath();
    for(let k=0;k<2;k++){const a=ph+k*Math.PI;let fx=sx+Math.sin(a)*16,fy=gy-b.off-Math.max(0,Math.cos(a))*8;
      if(b.off>0){fx=sx+(k?-7:7);fy=hip+26}
      const kx=(sx+fx)/2+(b.hf<.8?16:7),ky=(hip+fy)/2;x.moveTo(sx,hip);x.lineTo(kx,ky);x.lineTo(fx,fy)}};
  x.lineCap=x.lineJoin='round';
  limbs();x.strokeStyle=rim;x.lineWidth=6;x.stroke();
  limbs();x.strokeStyle=dark;x.lineWidth=3.5;x.stroke();
  limbs();x.strokeStyle='#555a70';x.lineWidth=.8;x.stroke();
  x.beginPath();x.moveTo(sx+lean+(front?13:-13),sh+12);x.lineTo(sx+lean,sh+2);x.lineTo(sx+lean+(front?4:-4),cy+10);x.strokeStyle=rim;x.lineWidth=6;x.stroke();x.strokeStyle='#2a1f20';x.lineWidth=3.5;x.stroke();
  x.beginPath();x.moveTo(sx+lean-6,sh);x.lineTo(sx+lean+6,sh);x.lineTo(sx+6,hip+4);x.lineTo(sx+7,hip+26);x.lineTo(sx,hip+20);x.lineTo(sx-8,hip+26);x.lineTo(sx-5,hip+4);x.closePath();
  x.fillStyle='#2a1f20';x.fill();x.strokeStyle=rim;x.lineWidth=1.5;x.stroke();
  x.fillStyle='#e4e9ef';x.beginPath();x.moveTo(sx+lean-2,sh+1);x.lineTo(sx+lean+3,sh+1);x.lineTo(sx+lean+1,sh+16);x.closePath();x.fill();
  x.fillStyle='#9aa3ad';x.beginPath();x.moveTo(sx+lean-4,sh);x.lineTo(sx+lean+5,sh);x.lineTo(sx+lean+1,sh+9);x.closePath();x.fill();
  x.fillStyle='#7b6a60';for(let k=0;k<3;k++){x.beginPath();x.arc(sx+lean/2,sh+12+k*7,1.1,0,7);x.fill()}
  x.fillStyle='#cfd9e4';x.beginPath();x.arc(sx+lean+(front?4:-4),cy+10,3,0,7);x.fill()
}
function fig2(sx,gy,b,front,cy,ph){
  const hip=gy-b.off-H*b.hf*.5,sh=gy-b.off-H*b.hf*.84,lean=front?5:-3,hurt=b.st>0,dark=hurt?'#5a1e25':'#0f1016',rim=hurt?'#ff7a6b':'#6d7f9c';
  const limbs=()=>{x.beginPath();
    for(let k=0;k<2;k++){const a=ph+k*Math.PI;let fx=sx+Math.sin(a)*16,fy=gy-b.off-Math.max(0,Math.cos(a))*8;
      if(b.off>0){fx=sx+(k?-7:7);fy=hip+26}
      const kx=(sx+fx)/2+(b.hf<.8?16:7),ky=(hip+fy)/2;x.moveTo(sx,hip);x.lineTo(kx,ky);x.lineTo(fx,fy)}
    x.moveTo(sx+lean,sh+2);x.lineTo(sx+lean+(front?13:-13),sh+12);x.lineTo(sx+lean+(front?4:-4),cy+10)};
  x.lineCap=x.lineJoin='round';
  limbs();x.strokeStyle=rim;x.lineWidth=6;x.stroke();
  limbs();x.strokeStyle=dark;x.lineWidth=3.5;x.stroke();
  x.beginPath();x.moveTo(sx+lean-6,sh);x.lineTo(sx+lean+6,sh);x.lineTo(sx+5,hip+4);x.lineTo(sx+6,hip+30);x.lineTo(sx,hip+18);x.lineTo(sx-8,hip+30);x.lineTo(sx-5,hip+4);x.closePath();
  x.fillStyle=dark;x.fill();x.strokeStyle=rim;x.lineWidth=1.5;x.stroke();
  x.fillStyle='#e9eef5';x.beginPath();x.moveTo(sx+lean-2,sh+1);x.lineTo(sx+lean+3,sh+1);x.lineTo(sx+lean+1,sh+22);x.closePath();x.fill();
  x.fillStyle='#d6dfea';x.beginPath();x.arc(sx+lean+(front?4:-4),cy+10,3,0,7);x.fill()
}
function figOld(sx,gy,b,front,cy,ph){
  const hip=gy-b.off-H*b.hf*.5,sh=gy-b.off-H*b.hf*.84,lean=front?5:-3;
  x.strokeStyle=b.st>0?'#ff7a6b':'#f4ead5';x.fillStyle=x.strokeStyle;x.lineWidth=3.5;x.lineCap=x.lineJoin='round';
  x.beginPath();
  for(let k=0;k<2;k++){
    const a=ph+k*Math.PI;let fx=sx+Math.sin(a)*16,fy=gy-b.off-Math.max(0,Math.cos(a))*8;
    if(b.off>0){fx=sx+(k?-7:7);fy=hip+26}
    const kx=(sx+fx)/2+(b.hf<.8?16:7),ky=(hip+fy)/2;
    x.moveTo(sx,hip);x.lineTo(kx,ky);x.lineTo(fx,fy)
  }
  x.moveTo(sx,hip);x.lineTo(sx+lean,sh);
  x.moveTo(sx+lean,sh+2);x.lineTo(sx+lean+(front?13:-13),sh+12);x.lineTo(sx+lean+(front?4:-4),cy+10);
  x.stroke();
  
}
