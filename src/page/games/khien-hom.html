<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khiêng Hòm</title>
<style>
:root{--bg:#161126;--fg:#f4ead5;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161126;--fg:#f4ead5}}
:root[data-theme="dark"]{--bg:#161126;--fg:#f4ead5}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:8px;box-sizing:border-box}
canvas{width:min(100%,960px);aspect-ratio:960/440;display:block;border-radius:6px}
p{margin:0;font-size:14px;line-height:1.5;text-align:center;max-width:760px}
b{color:#ffd36b}
</style></head><body>
<canvas id="c"></canvas>
<p><b>Người đi sau (trái):</b> W nhảy, S khom, A/D chỉnh xác. <b>Người đi trước (phải):</b> ↑ nhảy, ↓ khom, ←/→ chỉnh xác. Nhảy qua lư hương, khom qua cổng cổ. Tới khoảng 1000 m, trên ván cầu qua huyệt, nghiêng hòm cho xác rơi xuống huyệt để thắng; rơi ngoài huyệt là thua.</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=960,HH=440;c.width=W;c.height=HH;
const L=120,H=118,HL=85,GY=332,keys={};let S,mode='ready',best=0,last=0;
const amp=w=>1+Math.min(1,Math.max(0,w-800)/4000);
const gb=w=>320+amp(w)*(26*Math.sin(w/260)+16*Math.sin(w/97+1.3));
const g=w=>{const p=S.pit,d=Math.max(p.x0-60-w,w-p.x1-60,0),f=Math.max(0,1-d/160),k=f*f*(3-2*f);return gb(w)*(1-k)+GY*k};
const surf=cx=>{const a=[],p=S.pit;let pr=null;for(let i=0;i<=W;i+=8){const w=cx+i,ins=w>p.x0&&w<p.x1;if(pr!==null&&pr!==ins){const e=(ins?p.x0:p.x1)-cx,t=[e,GY],u=[e,GY+112];a.push(...(ins?[t,u]:[u,t]))}pr=ins;a.push([i,ins?GY+112:g(w)])}return a};
const mk=()=>({off:0,vy:0,hf:1,st:0});
function reset(){S={xf:200,t:0,p:0,v:0,b:[mk(),mk()],obs:[],nx:900,slow:0,ph:0,flash:0,pit:{x0:20200,x1:20760},fl:null}}
reset();
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.code))e.preventDefault();
  if(e.repeat)return;keys[e.code]=1;
  if(mode==='fall')return;
  if(mode!=='play'){if(e.code==='Space'||e.code==='Enter'){reset();mode='play'}return}
  const j={ArrowUp:0,KeyW:1}[e.code];
  if(j!==undefined){const b=S.b[j];if(b.off===0&&b.vy===0&&b.st<=0)b.vy=380}
});
addEventListener('keyup',e=>keys[e.code]=0);
function startFall(xs,yf,yr){const a=Math.atan2(yf-yr,L),ca=Math.cos(a),sa=Math.sin(a);
  S.fl={x:(xs[0]+xs[1])/2+S.p*ca+15*sa,y:(yf+yr)/2+S.p*sa-15*ca,vx:S.v*ca,vy:S.v*sa-60,r:a,w:Math.sign(S.p)*3,t:0,te:0,res:null};
  mode='fall';best=Math.max(best,(S.xf-200)/20)}
function fallStep(dt){const f=S.fl;f.t+=dt;
  if(f.res){f.r*=Math.max(0,1-dt*10);if(f.t-f.te>1.1)mode=f.res;return}
  f.vy+=1100*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.r+=f.w*dt;
  const p=S.pit,inP=f.x>p.x0+8&&f.x<p.x1-8,fy=inP?GY+104:g(f.x)-8;
  if(f.y>=fy){f.y=fy;f.res=inP?'win':'over';f.te=f.t}}
function upd(dt){
  if(mode==='fall'){fallStep(dt);const xs=[S.xf,S.xf-L],b=S.b;return{xs,yf:g(xs[0])-b[0].off-H*b[0].hf*.84-12,yr:g(xs[1])-b[1].off-H*b[1].hf*.84-12}}
  S.t+=dt;S.slow=Math.max(0,S.slow-dt);S.flash=Math.max(0,S.flash-dt);
  const sp=(150+Math.min(90,S.xf/40))*(S.slow>0?.5:1)*(S.xf>S.pit.x0-120&&S.xf<S.pit.x1+60?.6:1);
  S.xf+=sp*dt;S.ph+=sp*dt/14;
  if(S.xf>S.pit.x1+450)S.pit={x0:S.pit.x0+20000,x1:S.pit.x1+20000};
  while(S.nx<S.xf+1200){const q=S.pit;if(S.nx>q.x0-420&&S.nx<q.x1+300){S.nx=q.x1+300;continue}S.obs.push({x:S.nx,t:Math.random()<.5?'low':'high',hit:[0,0]});S.nx+=430+Math.random()*280}
  S.obs=S.obs.filter(o=>o.x>S.xf-400);
  const xs=[S.xf,S.xf-L];
  S.b.forEach((b,i)=>{
    const cr=keys[i?'KeyS':'ArrowDown']&&b.off===0&&b.st<=0;
    b.hf+=((cr?.55:1)-b.hf)*Math.min(1,dt*14);b.st=Math.max(0,b.st-dt);
    if(b.off>0||b.vy>0){b.vy-=1100*dt;b.off+=b.vy*dt;if(b.off<=0){b.off=0;b.vy=0;S.v+=(Math.random()-.5)*120}}
    for(const o of S.obs){
      if(o.hit[i]||Math.abs(xs[i]-o.x)>10)continue;
      const top=b.off+H*b.hf*.84+22;
      if(o.t==='low'?b.off<34:top>100){o.hit[i]=1;b.st=.5;S.slow=.5;S.flash=.25;S.v-=240}
    }
  });
  const[f,r]=S.b,yf=g(xs[0])-f.off-H*f.hf*.84-12,yr=g(xs[1])-r.off-H*r.hf*.84-12;
  const s=Math.sin(Math.atan2(yf-yr,L));
  S.v+=900*(Math.abs(s)>.1?s-Math.sign(s)*.1:0)*dt;
  S.v+=((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0)+(keys.KeyD?1:0)-(keys.KeyA?1:0))*320*dt;
  S.v*=Math.max(0,1-2*dt);S.p+=S.v*dt;
  if(Math.abs(S.p)>HL-8)startFall(xs,yf,yr);
  return{xs,yf,yr}
}
function headV(hx,hy,fr,b){
  const d=fr?1:-1,hurt=b.st>0,sk=hurt?'#f0b8a8':'#e9cdb0';
  x.lineCap='round';x.strokeStyle=sk;x.lineWidth=5;x.beginPath();x.moveTo(hx-d*2,hy+7);x.lineTo(hx-d*2,hy+15);x.stroke();
  x.fillStyle=sk;x.beginPath();x.ellipse(hx,hy,7.5,10,0,0,7);x.fill();
  x.beginPath();x.moveTo(hx+d*7,hy+2);x.lineTo(hx+d*10,hy+5.5);x.lineTo(hx+d*7,hy+6.5);x.fill();
  x.fillStyle='#d9b894';x.beginPath();x.ellipse(hx-d*4,hy+2,2,3.2,0,0,7);x.fill();
  x.fillStyle='#0a0a0d';x.beginPath();x.ellipse(hx-d*1.5,hy-3,8.4,8.6,0,Math.PI,0);x.lineTo(hx-d*8,hy+1);x.lineTo(hx-d*8.5,hy-3);x.closePath();x.fill();
  x.fillRect(hx-d*8-(d>0?0:-1),hy-3,3,7);
  x.fillStyle='#050507';x.beginPath();x.roundRect(hx+d*3.5-5.5,hy-2.5,11,6,2);x.fill();
  x.strokeStyle='#050507';x.lineWidth=1.4;x.beginPath();x.moveTo(hx-d*1.5,hy-.5);x.lineTo(hx-d*6.5,hy-1.5);x.stroke();
  x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=1;x.beginPath();x.moveTo(hx+d*3.5-3,hy-1.5);x.lineTo(hx+d*3.5-1,hy-.5);x.stroke();
  x.strokeStyle='#7a4b3a';x.lineWidth=1.4;x.beginPath();
  if(hurt)x.ellipse(hx+d*4,hy+8,1.8,2.4,0,0,7);else{x.moveTo(hx+d*1.5,hy+7.8);x.lineTo(hx+d*5.5,hy+7.8)}
  x.stroke()
}
function fig(sx,gy,b,front,cy,ph){
  const hip=gy-b.off-H*b.hf*.5,sh=gy-b.off-H*b.hf*.84,lean=front?5:-3,hurt=b.st>0,blk=hurt?'#3a1c20':'#0d0d12',ed=hurt?'#ff7a6b':'#4a5164',W2='#f2f4f7';
  const seg=(ax,ay,bx,by,w,c)=>{x.strokeStyle=c;x.lineWidth=w;x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke()};
  x.lineCap=x.lineJoin='round';
  for(const k of[1,0]){
    const a=ph+k*Math.PI;let fx=sx+Math.sin(a)*16,fy=gy-b.off-Math.max(0,Math.cos(a))*8;
    if(b.off>0){fx=sx+(k?-7:7);fy=hip+26}
    const kx=(sx+fx)/2+(b.hf<.8?16:7),ky=(hip+fy)/2;
    seg(sx,hip,kx,ky,8,ed);seg(kx,ky,fx,fy,7,ed);seg(sx,hip,kx,ky,6.4,blk);seg(kx,ky,fx,fy,5.4,blk);
    x.fillStyle='#050507';x.strokeStyle='#8a92a6';x.lineWidth=1;x.beginPath();x.ellipse(fx+4,fy-1,7,3,0,0,7);x.fill();x.stroke()
  }
  x.beginPath();x.moveTo(sx+lean-8,sh);x.lineTo(sx+lean+8,sh);x.lineTo(sx+8,hip+6);x.lineTo(sx+8,hip+25);x.lineTo(sx-8,hip+25);x.lineTo(sx-8,hip+6);x.closePath();
  x.fillStyle=blk;x.fill();x.strokeStyle=ed;x.lineWidth=1.2;x.stroke();
  x.fillStyle=W2;x.beginPath();x.moveTo(sx+lean-3.5,sh+.5);x.lineTo(sx+lean+4.5,sh+.5);x.lineTo(sx+lean+.5,sh+21);x.closePath();x.fill();
  x.fillStyle='#000';x.beginPath();x.moveTo(sx+lean-.6,sh+3);x.lineTo(sx+lean+2.2,sh+3);x.lineTo(sx+lean+3.2,sh+17);x.lineTo(sx+lean+.8,sh+20);x.lineTo(sx+lean-1.6,sh+17);x.closePath();x.fill();
  seg(sx+lean-5,sh+.5,sx+lean-.5,sh+16,1.4,'#2a3040');seg(sx+lean+5.5,sh+.5,sx+lean+1.5,sh+16,1.4,'#2a3040');
  x.fillStyle=W2;x.fillRect(sx+lean-6.5,sh+9,3.5,1.6);
  x.fillStyle='#2a3040';for(let k=0;k<2;k++){x.beginPath();x.arc(sx+lean*.4,sh+23+k*0,.01,0,7)}
  const ex=sx+lean+(front?12:-12),ey=sh+13,hx=sx+lean+(front?4:-4),hy=cy+10;
  seg(sx+lean,sh+2,ex,ey,8,ed);seg(ex,ey,hx,hy,8,ed);seg(sx+lean,sh+2,ex,ey,6.4,blk);seg(ex,ey,hx,hy,6.4,blk);
  seg(hx+(ex-hx)*.22,hy+(ey-hy)*.22,hx+(ex-hx)*.38,hy+(ey-hy)*.38,6.8,W2);
  x.fillStyle='#e9cdb0';x.beginPath();x.arc(hx,hy-.5,3.3,0,7);x.fill()
}
function bride(){
  const t=S.t,sw=Math.sin(t*7)*Math.min(6,Math.abs(S.v)/25)+Math.sin(t*3)*1.5,sc=Math.abs(S.p)>HL*.55;
  x.shadowColor='#7fc8ff';x.shadowBlur=12;
  x.fillStyle='rgba(190,225,255,.28)';x.beginPath();x.moveTo(18,-12);x.quadraticCurveTo(-10,-30+sw,-52,-18+sw*1.5);x.quadraticCurveTo(-56,-2,-48,14+sw);x.quadraticCurveTo(-10,10,12,4);x.closePath();x.fill();
  x.strokeStyle='rgba(220,240,255,.5)';x.lineWidth=1;x.beginPath();x.moveTo(10,-14);x.quadraticCurveTo(-20,-22+sw,-50,-8+sw);x.stroke();
  x.strokeStyle='#dfe8f0';x.lineWidth=2.2;x.lineCap='round';x.beginPath();x.moveTo(-46,6);x.lineTo(-60,10+sw*.3);x.lineTo(-64,6);x.moveTo(-60,10+sw*.3);x.lineTo(-65,12);x.stroke();
  x.fillStyle='#6f98c6';x.strokeStyle='#3f6693';x.lineWidth=1.2;x.beginPath();
  [[-4,-9],[-4,6],[-26,11],[-46,15],[-42,8],[-50,5],[-44,-1],[-52,-4],[-44,-9],[-46,-15],[-30,-13],[-10,-12]].forEach((p,i)=>x[i?'lineTo':'moveTo'](p[0],p[1]));
  x.closePath();x.fill();x.stroke();
  x.strokeStyle='#4f78a8';x.beginPath();x.moveTo(-8,-5);x.lineTo(-44,-9);x.moveTo(-8,0);x.lineTo(-46,5);x.moveTo(-8,4);x.lineTo(-40,12);x.stroke();
  x.strokeStyle='#a9c8e8';x.beginPath();x.moveTo(-46,15);x.lineTo(-42,8);x.lineTo(-50,5);x.lineTo(-44,-1);x.stroke();
  x.fillStyle='#86aed6';x.beginPath();x.moveTo(-6,-10);x.lineTo(10,-12);x.lineTo(12,2);x.lineTo(-6,4);x.closePath();x.fill();x.strokeStyle='#5d84b1';x.lineWidth=1;
  x.beginPath();for(let k=0;k<3;k++){x.moveTo(1+k*3,-8);x.lineTo(1+k*3,0)}x.stroke();
  x.strokeStyle='#7fa6cf';x.lineWidth=3.5;x.beginPath();x.moveTo(6,2);x.lineTo(4+sw*.4,12);x.lineTo(2+sw*.8,22);x.stroke();
  x.fillStyle='#9cc3e2';x.beginPath();x.arc(2+sw*.8,23,2.6,0,7);x.fill();
  x.strokeStyle='#7fa6cf';x.beginPath();x.moveTo(10,-10);x.lineTo(2,-9);x.lineTo(6,-13);x.stroke();
  [['#5b7fcf',0,-16],['#c9d9ff',4,-18],['#4a66b0',-3,-18],['#9db8f0',2,-20]].forEach(f=>{x.fillStyle=f[0];x.beginPath();x.arc(2+f[1],f[2],3,0,7);x.fill()});
  x.strokeStyle='#e0c070';x.lineWidth=1.6;x.beginPath();x.moveTo(-6,-9);x.lineTo(-6,5);x.moveTo(-26,-12.5);x.lineTo(-26,11);x.moveTo(-46,-14);x.lineTo(-46,14);x.stroke();
  x.save();x.translate(22,-5);x.rotate(Math.PI/2);
  x.strokeStyle='#0f1a3a';x.lineWidth=5;x.beginPath();x.moveTo(5,0);x.quadraticCurveTo(11,14+sw,5,30+sw*1.5);x.moveTo(1,2);x.quadraticCurveTo(6,16+sw,0,32+sw*1.5);x.moveTo(8,-2);x.quadraticCurveTo(14,10+sw,10,26+sw);x.stroke();
  x.fillStyle='#8fb4d8';x.beginPath();x.ellipse(0,0,9,10.5,0,0,7);x.fill();
  x.fillStyle='#0f1a3a';x.beginPath();x.ellipse(2.5,-3,8,8,0,0,7);x.fill();
  x.fillStyle='#cfe3ff';[[-2,-9],[3,-10],[7,-7]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],1.4,0,7);x.fill()});
  const er=sc?4.8:4.1;
  x.fillStyle='#26335a';x.beginPath();x.ellipse(-3.5,-1,er+1.4,er+1.8,0,0,7);x.fill();
  x.fillStyle='#fff';x.beginPath();x.ellipse(-3.5,-1,er,er+.6,0,0,7);x.fill();
  x.fillStyle='#0a0f22';x.beginPath();x.arc(-5,-.5,sc?1.2:1.8,0,7);x.fill();
  x.strokeStyle='#0f1a3a';x.lineWidth=1.2;x.beginPath();x.moveTo(-5,-6.5);x.quadraticCurveTo(-3,-8.5,0,-7.5);x.moveTo(-7,-3.5);x.lineTo(-9,-5);x.stroke();
  x.strokeStyle='#6f93b8';x.beginPath();x.moveTo(-8.5,1);x.lineTo(-11,3.5);x.lineTo(-8.5,5);x.stroke();
  x.strokeStyle='#7a6bb0';x.lineWidth=1.8;x.beginPath();if(sc){x.ellipse(-6,7.5,1.8,2.4,0,0,7)}else{x.moveTo(-8,7.5);x.quadraticCurveTo(-6,8.6,-4,7.5)}x.stroke();
  x.restore()
}
function obst(sx,gy,t){x.lineJoin='round';const G='#e0b060';
  if(t==='low'){
    x.fillStyle='#7d8590';x.strokeStyle='#3b4452';x.lineWidth=1.5;x.fillRect(sx-17,gy-10,34,10);x.strokeRect(sx-17,gy-10,34,10);
    x.fillStyle='#9aa3ad';x.fillRect(sx-13,gy-16,26,6);
    x.fillStyle='#8a5a2b';x.strokeStyle=G;x.beginPath();x.moveTo(sx-11,gy-16);x.quadraticCurveTo(sx-15,gy-30,sx-9,gy-34);x.lineTo(sx+9,gy-34);x.quadraticCurveTo(sx+15,gy-30,sx+11,gy-16);x.closePath();x.fill();x.stroke();
    x.beginPath();x.arc(sx-13,gy-27,4,Math.PI*.5,Math.PI*1.5);x.moveTo(sx+13,gy-23);x.arc(sx+13,gy-27,4,-Math.PI*.5,Math.PI*.5);x.stroke();
    x.strokeStyle='#c43b2a';x.beginPath();for(const k of[-4,0,4]){x.moveTo(sx+k,gy-34);x.lineTo(sx+k,gy-44)}x.stroke();
    x.strokeStyle='rgba(220,230,240,.35)';x.lineWidth=1;x.beginPath();for(const k of[-4,0,4]){x.moveTo(sx+k,gy-44);x.quadraticCurveTo(sx+k+6*Math.sin(S.t*2+k),gy-54,sx+k-3,gy-64)}x.stroke()
  }else{
    for(const k of[-24,24]){x.fillStyle='#7a241d';x.fillRect(sx+k-5,gy-126,10,126);x.fillStyle='#5b5f68';x.fillRect(sx+k-8,gy-8,16,8);x.fillStyle=G;x.fillRect(sx+k-5,gy-30,10,3)}
    x.fillStyle='#5a1a16';x.fillRect(sx-29,gy-108,58,8);x.fillStyle=G;x.fillRect(sx-29,gy-102,58,2);
    x.fillStyle='#2f3a3a';x.strokeStyle='#8fa0a0';x.lineWidth=1.5;x.beginPath();x.moveTo(sx-42,gy-112);x.quadraticCurveTo(sx-28,gy-110,sx-24,gy-126);x.lineTo(sx-8,gy-140);x.lineTo(sx+8,gy-140);x.lineTo(sx+24,gy-126);x.quadraticCurveTo(sx+28,gy-110,sx+42,gy-112);x.lineTo(sx+31,gy-108);x.lineTo(sx-31,gy-108);x.closePath();x.fill();x.stroke();
    x.strokeStyle='#4d5d5d';x.lineWidth=1;x.beginPath();for(let k=-20;k<=20;k+=8){x.moveTo(sx+k,gy-110);x.lineTo(sx+k*.6,gy-136)}x.stroke();
    x.fillStyle=G;x.fillRect(sx-3,gy-146,6,6);
    x.strokeStyle=G;x.beginPath();x.moveTo(sx+36,gy-110);x.lineTo(sx+36,gy-98);x.stroke();
    x.save();x.shadowColor='#ff8a50';x.shadowBlur=10;x.fillStyle='#c9332a';x.beginPath();x.ellipse(sx+36,gy-90,6,8,0,0,7);x.fill();x.restore()
  }}
function coffin(len){const h=len/2,q=x.createLinearGradient(0,-12,0,12);q.addColorStop(0,'#7a4a2a');q.addColorStop(.5,'#4b2a18');q.addColorStop(1,'#26140c');
  x.fillStyle=q;x.strokeStyle='#d8b25a';x.lineWidth=2;x.beginPath();x.moveTo(-h+10,-12);x.lineTo(h-8,-12);x.lineTo(h,-4);x.lineTo(h,6);x.lineTo(h-8,12);x.lineTo(-h+10,12);x.lineTo(-h,6);x.lineTo(-h,-4);x.closePath();x.fill();x.stroke();
  x.strokeStyle='#9c2a22';x.lineWidth=3;x.beginPath();x.moveTo(-h+14,-6);x.lineTo(h-12,-6);x.stroke();
  x.strokeStyle='rgba(216,178,90,.8)';x.lineWidth=1;x.beginPath();x.moveTo(-h+14,3);x.lineTo(h-12,3);x.stroke();
  x.fillStyle='#d8b25a';for(const k of[-.32,0,.32]){x.beginPath();x.arc(k*len,7,2,0,7);x.fill()}
  x.fillStyle='#3a2416';x.fillRect(-h-14,10,len+28,4);x.fillStyle='#d8b25a';x.fillRect(-h-14,10,3,4);x.fillRect(h+11,10,3,4)}
function draw(d){
  const cx=S.xf-320,sk=x.createLinearGradient(0,0,0,HH);
  sk.addColorStop(0,'#06182c');sk.addColorStop(1,'#14476a');x.fillStyle=sk;x.fillRect(0,0,W,HH);
  for(let i=0;i<60;i++){x.globalAlpha=.35+.35*Math.sin(S.t*2+i);x.fillStyle='#cfe1ff';x.fillRect(((i*173.3-cx*.05)%W+W)%W,(i*61.7)%230,2,2)}
  x.globalAlpha=1;x.save();x.shadowColor='#7fc8ff';x.shadowBlur=90;x.fillStyle='#bfe3ff';x.beginPath();x.arc(740,120,95,0,7);x.fill();x.restore();
