<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Chibi Rush – Đường đua bẫy ẩn</title>
    <style>
      :root {
        --sky1: #9fd8ff;
        --sky2: #ffe3f1;
        --ink: #3b2f5c;
        --card: rgba(255, 255, 255, 0.88);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --sky1: #2b3a6b;
          --sky2: #6b4a8c;
          --ink: #f3eaff;
          --card: rgba(30, 24, 60, 0.85);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --sky1: #2b3a6b;
        --sky2: #6b4a8c;
        --ink: #f3eaff;
        --card: rgba(30, 24, 60, 0.85);
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(var(--sky1), var(--sky2));
        color: var(--ink);
        touch-action: none;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
        z-index: 0;
      }
      .card {
        position: fixed;
        z-index: 10;
        background: var(--card);
        border-radius: 18px;
        padding: 10px 16px;
        font-weight: 700;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12);
      }
      #hud {
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        left: 12px;
        line-height: 1.5;
      }
      #hint {
        bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
        left: 50%;
        transform: translateX(-50%);
        font-size: 13px;
        white-space: nowrap;
      }
      #toast {
        top: calc(env(safe-area-inset-top, 0px) + 14px);
        left: 50%;
        transform: translateX(-50%);
        font-size: 18px;
        opacity: 0;
        transition: opacity 0.25s;
        white-space: nowrap;
      }
      #win {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        display: none;
        padding: 24px 34px;
        font-size: 18px;
      }
      #win h2 {
        margin: 0 0 8px;
        font-size: 30px;
      }
      .pn {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        min-width: 270px;
      }
      .pn h2 {
        margin: 0 0 10px;
      }
      .pn input {
        font: inherit;
        font-weight: 700;
        padding: 9px 12px;
        border-radius: 12px;
        border: 2px solid #ffb3d1;
        margin: 4px 0;
        width: 200px;
        text-align: center;
        background: #fff;
        color: #3b2f5c;
      }
      .pn .row {
        display: flex;
        gap: 8px;
        justify-content: center;
        align-items: center;
      }
      .pn .row input {
        width: 110px;
        text-transform: uppercase;
      }
      .pn button.alt {
        background: #8e7bff;
        box-shadow: 0 4px 0 #6a58cc;
      }
      .sm {
        font-size: 13px;
        font-weight: 600;
        margin-top: 8px;
        opacity: 0.85;
      }
      #pl div {
        padding: 3px 0;
      }
      #cdn {
        position: fixed;
        z-index: 10;
        top: 32%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 96px;
        font-weight: 900;
        color: #fff;
        text-shadow: 0 6px 0 #ff7eb6;
        pointer-events: none;
      }
      button {
        margin-top: 12px;
        font: inherit;
        font-weight: 800;
        border: 0;
        border-radius: 14px;
        padding: 10px 22px;
        background: #ff7eb6;
        color: #fff;
        cursor: pointer;
        box-shadow: 0 4px 0 #d2588f;
      }
    </style>
  </head>
  <body>
    <div id="hud" class="card">
      <div>⏱ <span id="tm">0.00</span>s</div>
      <div>💥 Ngã: <span id="dc">0</span></div>
      <div>📍 <span id="pg">0</span>%</div>
    </div>
    <div id="toast" class="card"></div>
    <div id="hint" class="card">
      WASD / mũi tên: chạy · Space: nhảy · Cảm ứng: kéo trái = chạy, chạm phải =
      nhảy
    </div>
    <div id="win" class="card">
      <h2>🏁 Kết quả</h2>
      <div id="ws"></div>
      <button id="rb">Về phòng chờ</button>
    </div>
    <div id="menu" class="card pn">
      <h2>🏃 Chibi Rush</h2>
      <input id="nm" maxlength="12" placeholder="Tên của bạn" /><br /><button
        id="bq"
      >
        👥 Chơi nhiều người</button
      ><br /><button id="bs" class="alt">🎮 Chơi một mình</button>
      <div class="sm">hoặc phòng riêng với bạn bè:</div>
      <button id="bc">Tạo phòng</button>
      <div class="row">
        <input id="cd_in" maxlength="4" placeholder="Mã phòng" /><button
          id="bj"
        >
          Vào phòng
        </button>
      </div>
      <div id="mm" class="sm"></div>
    </div>
    <div
      id="lobby"
      class="card pn"
      style="display: none; top: 86px; transform: translateX(-50%)"
    >
      <h2>Phòng <span id="rc"></span></h2>
      <div id="pl"></div>
      <div id="lw" class="sm"></div>
      <button id="st">Bắt đầu</button>
    </div>
    <div id="cdn"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      const $ = (i) => document.getElementById(i);
      const R = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      R.setSize(innerWidth, innerHeight);
      R.setPixelRatio(Math.min(devicePixelRatio, 2));
      document.body.appendChild(R.domElement);
      const S = new THREE.Scene(),
        C = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 400);
      S.add(new THREE.HemisphereLight(0xffffff, 0xffc8e6, 0.95));
      const DL = new THREE.DirectionalLight(0xffffff, 0.8);
      DL.position.set(10, 20, 8);
      S.add(DL);
      addEventListener("resize", () => {
        R.setSize(innerWidth, innerHeight);
        C.aspect = innerWidth / innerHeight;
        C.updateProjectionMatrix();
      });
      const tm = (c) =>
        new THREE.MeshToonMaterial({ color: c, side: THREE.DoubleSide });
      const OM = new THREE.MeshBasicMaterial({
        color: 0x2b2147,
        side: THREE.BackSide,
      });
      function mk(g, c, o = 1.07) {
        const m = new THREE.Mesh(g, tm(c));
        if (o) {
          const l = new THREE.Mesh(g, OM);
          l.scale.setScalar(o);
          m.add(l);
        }
        return m;
      }
      let sd = 7;
      const rnd = () => {
        sd = (sd * 16807) % 2147483647;
        return sd / 2147483647;
      };

      // ===== Map: hình thang cân, rộng 44 -> hẹp 16, dài 125 =====
      const LEN = 260,
        FZ = 256,
        hw = (z) => 22 - 14 * Math.min(1, Math.max(0, -z / LEN));
      const FM = [tm(0xffe2f0), tm(0xd8ecff)];
      function quad(z0, z1, N, c, mat) {
        const a = hw(z0),
          b = hw(z1),
          x = (h, i) => -h + (2 * h * i) / N;
        const g = new THREE.BufferGeometry();
        g.setAttribute(
          "position",
          new THREE.Float32BufferAttribute(
            [
              x(a, c),
              0,
              z0,
              x(a, c + 1),
              0,
              z0,
              x(b, c + 1),
              0,
              z1,
              x(b, c),
              0,
              z1,
            ],
            3,
          ),
        );
        g.setIndex([0, 1, 2, 0, 2, 3]);
        g.computeVertexNormals();
        const m = new THREE.Mesh(g, mat);
        S.add(m);
        return m;
      }
      const TZ0 = -40,
        TR = 8,
        TH = 4,
        TN = 8,
        tiles = [];
      const HOLES = [
          [140, 144],
          [148, 152],
          [156, 160],
          [172, 212],
          [236, 240],
          [244, 248],
        ],
        CONV = [
          [216, 220, 1],
          [220, 224, -1],
          [224, 228, 1],
          [228, 232, -1],
        ],
        CM = [tm(0xffb347), tm(0x6fe0c0)];

      for (let r = 0; r < TR; r++) {
        const row = [];
        let real = 0;
        for (let c = 0; c < TN; c++) {
          const f = rnd() < (c === 0 || c === TN - 1 ? 0.8 : 0.5);
          row.push({
            fake: f,
            t: -1,
            alive: true,
            vy: 0,
            mesh: quad(TZ0 - r * TH, TZ0 - r * TH - TH, TN, c, FM[(r + c) % 2]),
          });
          if (!f) real++;
        }
        for (let c = 1; real < 3 && c < TN - 1; c++)
          if (row[c].fake) {
            row[c].fake = false;
            real++;
            c += 2;
          }
        tiles.push(row);
      }
      const inHole = (z) => HOLES.some((h) => -z > h[0] && -z < h[1]);
      for (let i = 0; i < 65; i++) {
        const z0 = -4 * i,
          z1 = z0 - 4;
        if ((z0 <= TZ0 && z1 >= TZ0 - TR * TH) || inHole(z0 - 2)) continue;
        const cn = CONV.find((c) => -z0 >= c[0] && -z0 < c[1]);
        for (let c = 0; c < 4; c++)
          quad(z0, z1, 4, c, cn ? CM[cn[2] > 0 ? 0 : 1] : FM[(i + c) % 2]);
      }
      function tileAt(x, z) {
        const r = Math.floor((TZ0 - z) / TH);
        if (r < 0 || r >= TR) return null;
        const h = hw(z);
        return tiles[r][
          Math.max(0, Math.min(TN - 1, Math.floor(((x + h) / (2 * h)) * TN)))
        ];
      }
      const inTZ = (z) => z <= TZ0 && z > TZ0 - TR * TH;
      function ground(x, z) {
        if (z > 16 || z < -LEN) return false;
        if (inHole(z)) return EX.some((o) => o.has(x, z));
        if (Math.abs(x) > hw(z)) return false;
        if (inTZ(z)) {
          const t = tileAt(x, z);
          return t && t.alive;
        }
        return true;
      }

      // vạch đích
      const hF = hw(-FZ);
      [-1, 1].forEach((s) => {
        const p = mk(new THREE.BoxGeometry(1, 7, 1), 0xffd166);
        p.position.set(s * (hF - 0.6), 3.5, -FZ);
        S.add(p);
      });
      const bm = mk(new THREE.BoxGeometry(2 * hF, 1.4, 1), 0xff7eb6);
      bm.position.set(0, 7, -FZ);
      S.add(bm);
      // mây
      const cm = new THREE.MeshToonMaterial({ color: 0xffffff });
      for (let i = 0; i < 34; i++) {
        const g = new THREE.Group();
        for (let j = 0; j < 3; j++) {
          const s = new THREE.Mesh(new THREE.SphereGeometry(2 + j, 12, 8), cm);
          s.position.set(j * 2.5, j % 2, 0);
          g.add(s);
        }
        g.position.set(
          (i % 2 ? 1 : -1) * (30 + rnd() * 30),
          -6 - rnd() * 6,
          -rnd() * 270,
        );
        S.add(g);
      }

      // ===== Bẫy =====
      // 1) thanh quét
      const sweepers = [
        [-14, 1.8],
        [-24, -2.3],
        [-34, 2.8],
      ].map(([z, s]) => {
        const g = new THREE.Group();
        g.position.set(0, 0, z);
        const hub = mk(new THREE.CylinderGeometry(0.6, 0.7, 1.3, 16), 0xff6b8b);
        hub.position.y = 0.65;
        g.add(hub);
        const L1 = hw(z) + 0.5,
          L2 = hw(z) * 0.55,
          bar = mk(new THREE.BoxGeometry(1, 0.7, 0.7), 0xffd166);
        bar.scale.x = 2 * L1;
        bar.position.y = 0.55;
        g.add(bar);
        const b2 = bar.clone();
        b2.scale.x = 2 * L2;
        b2.rotation.y = Math.PI / 2;
        g.add(b2);
        S.add(g);
        return { g, z, s, L1, L2 };
      });
      // 2) gai ẩn dưới sàn
      const ringG = new THREE.RingGeometry(0.9, 1.4, 24);
      ringG.rotateX(-Math.PI / 2);
      const spikes = [];
      [-78, -84, -90, -96, -102]
        .map((z, i) => {
          const h = hw(z) - 0.8,
            n = Math.ceil((2 * h) / 5.5);
          return [
            z,
            Array.from(
              { length: i % 2 ? n : n + 1 },
              (_, k) => -h + (2 * h * (k + (i % 2 ? 0.5 : 0))) / n,
            ),
          ];
        })
        .forEach(([z, xs]) =>
          xs.forEach((x) => {
            const cone = mk(
              new THREE.ConeGeometry(0.7, 2.4, 10),
              0xff5d8f,
              1.08,
            );
            cone.position.set(x, -1.5, z);
            S.add(cone);
            const ring = new THREE.Mesh(
              ringG,
              new THREE.MeshBasicMaterial({
                color: 0xff2d55,
                transparent: true,
                opacity: 0.85,
              }),
            );
            ring.position.set(x, 0.03, z);
            ring.visible = false;
            S.add(ring);
            spikes.push({ x, z, cone, ring, st: 0, t: 0 });
          }),
        );
      // 3) búa đẩy hai bên
      const pushers = [-112, -118, -124, -130].map((z, i) => {
        const m = mk(
          new THREE.BoxGeometry(6, 1, 2.4),
          i % 2 ? 0x8e7bff : 0xff7a59,
        );
        m.position.y = 0.5;
        m.position.z = z;
        S.add(m);
        return { z, s: i % 2 ? -1 : 1, ph: i * 1.7, mesh: m };
      });

      // 4) bẫy ẩn trong khoảng trống, sàn trượt, băng chuyền, sàn tách đôi
      const EX = [];
      const launch = [
        [-140, -144],
        [-148, -152],
        [-156, -160],
      ].map(([a, b], i) => {
        const m = mk(new THREE.CylinderGeometry(1.8, 2, 0.7, 16), 0xff5d8f);
        m.visible = false;
        S.add(m);
        return {
          a,
          b,
          px: (i % 2 ? -1 : 1) * Math.min(7, hw(a) - 4),
          st: 0,
          t: 0,
          m,
        };
      });
      const pls = [-176, -184, -192, -200, -208].map((z, i) => {
        const m = mk(
          new THREE.BoxGeometry(11, 0.5, 4),
          i % 2 ? 0xc9a8ff : 0xffc2dc,
        );
        m.position.set(0, -0.25, z);
        S.add(m);
        const o = {
          z,
          m,
          x: 0,
          dx: 0,
          A: Math.min(7, hw(z) - 6.2),
          ws: 1.1 + i * 0.22,
          ph: i * 2.1,
          has: (x, zz) => Math.abs(x - o.x) <= 5.5 && Math.abs(zz - z) <= 2,
        };
        EX.push(o);
        return o;
      });
      const splits = [-238, -246].map((z) => {
        const w = hw(z),
          hs = [0, 1].map(() => {
            const m = mk(new THREE.BoxGeometry(w, 0.5, 4), 0xffb3d1);
            S.add(m);
            return m;
          });
        const o = {
          z,
          w,
          hs,
          off: 0,
          st: 0,
          t: 0,
          has: (x, zz) =>
            Math.abs(zz - z) <= 2 &&
            Math.abs(x) >= o.off &&
            Math.abs(x) <= w + o.off,
        };
        EX.push(o);
        return o;
      });
      const rid = [];
      CONV.forEach((c) => {
        for (let k = 0; k < 6; k++) {
          const m = new THREE.Mesh(
            new THREE.BoxGeometry(1.4, 0.08, 3),
            new THREE.MeshBasicMaterial({
              color: 0xffffff,
              transparent: true,
              opacity: 0.6,
            }),
          );
          S.add(m);
          rid.push({ m, c, k });
        }
      });

      // ===== Nhân vật chibi =====
      const hero = new THREE.Group();
      function part(g, c, x, y, z, sc) {
        const m = mk(g, c);
        m.position.set(x, y, z);
        if (sc) m.scale.set(...sc);
        hero.add(m);
        return m;
      }
      const SP = (r) => new THREE.SphereGeometry(r, 20, 14);
      part(SP(0.55), 0xff9ecb, 0, 0.65, 0, [1, 1.05, 0.9]);
      part(SP(0.8), 0xfff0e0, 0, 1.65, 0);
      part(
        new THREE.SphereGeometry(
          0.85,
          24,
          16,
          0,
          Math.PI * 2,
          0,
          Math.PI * 0.5,
        ),
        0x7a5cff,
        0,
        1.68,
        0,
      );
      part(
        new THREE.ConeGeometry(0.28, 0.6, 4),
        0x7a5cff,
        -0.55,
        2.35,
        0,
      ).rotation.z = 0.4;
      part(
        new THREE.ConeGeometry(0.28, 0.6, 4),
        0x7a5cff,
        0.55,
        2.35,
        0,
      ).rotation.z = -0.4;
      const eyes = [-1, 1].map((s) => {
        const e = part(SP(0.11), 0x2b2147, s * 0.28, 1.62, 0.74, [1, 1.5, 0.5]);
        const h = new THREE.Mesh(
          SP(0.04),
          new THREE.MeshBasicMaterial({ color: 0xffffff }),
        );
        h.position.set(0.25, 0.3, 1.2);
        e.add(h);
        return e;
      });
      [-1, 1].forEach((s) =>
        part(SP(0.12), 0xffa0b8, s * 0.46, 1.45, 0.66, [1.2, 0.7, 0.4]),
      );
      const armL = part(SP(0.17), 0xfff0e0, -0.64, 0.85, 0),
        armR = part(SP(0.17), 0xfff0e0, 0.64, 0.85, 0);
      const legL = part(SP(0.2), 0xffd166, -0.25, 0.2, 0),
        legR = part(SP(0.2), 0xffd166, 0.25, 0.2, 0);
      S.add(hero);

      // ===== Điều khiển =====
      const keys = {};
      let jb = 0,
        tx = 0,
        tz = 0,
        tid = null,
        t0x = 0,
        t0y = 0;
      addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT") return;
        keys[e.code] = 1;
        if (e.code === "Space") {
          jb = 0.12;
          e.preventDefault();
        }
        if (e.code.startsWith("Arrow")) e.preventDefault();
      });
      addEventListener("keyup", (e) => (keys[e.code] = 0));
      const cl = (v) => Math.max(-1, Math.min(1, v));
      addEventListener(
        "touchstart",
        (e) => {
          for (const t of e.changedTouches) {
            if (t.clientX > innerWidth / 2) jb = 0.12;
            else {
              tid = t.identifier;
              t0x = t.clientX;
              t0y = t.clientY;
            }
          }
        },
        { passive: true },
      );
      addEventListener(
        "touchmove",
        (e) => {
          for (const t of e.changedTouches)
            if (t.identifier === tid) {
              tx = cl((t.clientX - t0x) / 50);
              tz = cl((t.clientY - t0y) / 50);
            }
        },
        { passive: true },
      );
      addEventListener(
        "touchend",
        (e) => {
          for (const t of e.changedTouches)
            if (t.identifier === tid) {
              tid = null;
              tx = tz = 0;
            }
        },
        { passive: true },
      );

      // ===== Trạng thái =====
      const P = {
        sx: 0,
        x: 0,
        y: 0,
        z: 9,
        vx: 0,
        vy: 0,
        vz: 0,
        g: true,
        coy: 0,
        stun: 0,
        face: Math.PI,
        sq: 0,
        anim: 0,
      };
      const CZ = [0, -38, -74, -106, -138, -168, -214, -234],
        ZONES = [
          [-12, "🌀 Thanh quét – nhảy qua!"],
          [-40, "🕳 Sàn có ô giả – ô nào rung là sắp sập"],
          [-76, "⚠ Gai mọc từ đất – thấy vòng đỏ thì nhảy!"],
          [-110, "🔨 Búa hai bên – canh nhịp"],
          [-140, "🕳 Khoảng trống – dưới đáy có bẫy hất bạn sang hai bên!"],
          [-172, "🛹 Sàn trượt – canh nhịp rồi nhảy"],
          [-216, "⏩ Băng chuyền đẩy ngang – đừng để rơi!"],
          [-236, "✂ Sàn tách đôi – né sang hai bên!"],
        ];
      let started = false,
        done = false,
        go = false,
        phase = "menu",
        time = 0,
        deaths = 0,
        cp = 0,
        T = 0,
        zi = 0,
        best = null,
        toastT = 0;
      try {
        best = parseFloat(localStorage.getItem("cr_best")) || null;
      } catch (e) {}
      const appr = (a, b, d) =>
        a < b ? Math.min(a + d, b) : Math.max(a - d, b);
      function toast(s) {
        const t = $("toast");
        t.textContent = s;
        t.style.opacity = 1;
        clearTimeout(toastT);
        toastT = setTimeout(() => (t.style.opacity = 0), 2400);
      }
      function hit(kx, kz, up) {
        P.vx = kx;
        P.vz = kz;
        P.vy = up;
        P.g = false;
        P.coy = 0;
        P.stun = 0.55;
      }
      function respawn(count) {
        if (count) {
          deaths++;

              "s",
          );
        else if (m.t === "results") showResults(m.list);
      }
      let qn = 0;
      function openQuick() {
        const code = "PUB" + qn;
        roomCode = "ngẫu nhiên";
        $("mm").textContent = "Đang tìm phòng…";
        let opened = false;
        try {
          ws = new WebSocket(
            (location.protocol === "https:" ? "wss://" : "ws://") +
              location.host +
              "/ws?room=" +
              code +
              "&create=1&pub=1",
          );
        } catch (e) {
          $("mm").textContent = "Chưa có server – hãy chơi một mình";
          qn = 0;
          return;
        }
        ws.onopen = () => {
          opened = true;
          ws.send(JSON.stringify({ t: "join", name: myName }));
        };
        ws.onmessage = (e) => onMsg(JSON.parse(e.data));
        ws.onclose = () => {
          if (!opened) {
            $("mm").textContent =
              "Không kết nối được server – thử chơi một mình";
            qn = 0;
          } else if (phase !== "menu") {
            toast("Mất kết nối");
            leave();
          }
        };
      }
      function quick() {
        myName = $("nm").value.trim() || "Bạn" + ((Math.random() * 99) | 0);
        qn = 1;
        openQuick();
      }
      $("bq").onclick = quick;
      $("bc").onclick = () => connect(true);
      $("bj").onclick = () => connect(false);
      $("bs").onclick = () => {
        offline = true;
        myId = "me";
        roomCode = "SOLO";
        myName = $("nm").value.trim() || "Bạn";
        onMsg({
          t: "state",
          phase: "lobby",
          host: "me",
          players: [{ id: "me", name: myName, slot: 0 }],
        });
      };
      $("st").onclick = () => send({ t: "start" });
      $("rb").onclick = () => send({ t: "lobby" });
      reset();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
