<style>

<script>
const $=i=>document.getElementById(i),TAU=Math.PI*2,lerp=(a,b,k)=>a+(b-a)*k;

// ================= cảnh 3D =================
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
document.body.insertBefore(R.domElement,document.body.firstChild);
const S=new THREE.Scene();S.fog=new THREE.Fog(0xf0c8dc,60,170);

const GCOL=0xf4b94f,SKIN=0xf8d58a;

// nền đất, sân đá, mặt trăng, sao, núi
put(S,new THREE.Mesh(new THREE.CircleGeometry(150,48),tm(0xbfe3b0)),0,-.03,0,null,[-Math.PI/2,0,0]);
const tileTex=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#f4e8d4';x.fillRect(0,0,256,256);x.strokeStyle='#d9c5a8';x.lineWidth=5;x.strokeRect(0,0,256,256);
  x.beginPath();x.moveTo(128,0);x.lineTo(128,256);x.moveTo(0,128);x.lineTo(256,128);x.stroke();const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(8.5,8);return t})();
put(S,new THREE.Mesh(new THREE.BoxGeometry(34,.3,32),new THREE.MeshToonMaterial({map:tileTex})),0,-.15,6);
for(let i=0;i<7;i++){const m=mk(new THREE.ConeGeometry(26+i%3*6,26+i%4*8,7),i%2?0xc3b3ee:0xb3c4f0,0);put(S,m,-90+i*30,13+i%4*4-6,-120-i%2*20)}
put(S,new THREE.Mesh(new THREE.SphereGeometry(7,24,16),new THREE.MeshBasicMaterial({color:0xfff6d8,fog:false})),42,52,-130);
put(S,new THREE.Mesh(new THREE.SphereGeometry(11,24,16),new THREE.MeshBasicMaterial({color:0xfff6d8,transparent:true,opacity:.22,fog:false,depthWrite:false})),42,52,-130);
function pts(n,size,col,op,add){const g=new THREE.BufferGeometry(),pos=new Float32Array(n*3);g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const p=new THREE.Points(g,new THREE.PointsMaterial({size,color:col,transparent:true,opacity:op,depthWrite:false,sizeAttenuation:true,blending:add?THREE.AdditiveBlending:THREE.NormalBlending}));p.frustumCulled=false;S.add(p);return{p,pos,n}}
const stars=pts(160,2,0xffffff,.9,true);stars.p.material.fog=false;for(let i=0;i<160;i++){const a=Math.random()*TAU,e=.25+Math.random()*1.1,r=210;stars.pos.set([Math.cos(a)*Math.cos(e)*r,Math.sin(e)*r*.8+10,Math.sin(a)*Math.cos(e)*r*-1],i*3)}stars.p.geometry.attributes.position.needsUpdate=true;

// ===== chánh điện =====

put(hall,mk(new THREE.BoxGeometry(27,H0,15),0xe6d5ba,1.01),0,H0/2,-17.5);

put(hall,mk(new THREE.BoxGeometry(26,7.4,.5),0x5a2f55,0),0,H0+3.7,-24.8);

put(hall,new THREE.Mesh(new THREE.PlaneGeometry(24,7),new THREE.MeshBasicMaterial({color:0x3a2246})),0,H0+3.7,-24.5);
const colG=new THREE.CylinderGeometry(.5,.55,7.2,14);
[-11.6,-5.4,5.4,11.6].forEach(x=>[-10.9,-24.2].forEach(z=>{put(hall,mk(colG,0xc4553d),x,H0+3.6,z);put(hall,mk(new THREE.CylinderGeometry(.7,.7,.35,14),0xd9a441),x,H0+7.3,z)}));
const roofG=new THREE.ConeGeometry(.7071,1,4);roofG.rotateY(Math.PI/4);
put(hall,mk(roofG,0x4d8f8a,1.01),0,7.8+1.35,-17.5,[32,2.7,20.5]);
put(hall,mk(new THREE.BoxGeometry(18,2.8,11),0xb8503f,1.02),0,10.3,-17.5);
put(hall,mk(roofG,0x4d8f8a,1.01),0,11.7+1.8,-17.5,[22,3.6,14.5]);

[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>[[15.6,10,7.9],[10.6,7,11.8]].forEach(([hx,hz,y])=>put(hall,mk(new THREE.ConeGeometry(.28,1.3,6),0xffd166),sx*hx,y+.2,-17.5+sz*hz,null,[sz*.5,0,-sx*.5])));
const plq=(()=>{const c=document.createElement('canvas');c.width=256;c.height=96;const x=c.getContext('2d');x.fillStyle='#3a1f2b';x.fillRect(0,0,256,96);x.strokeStyle='#ffd166';x.lineWidth=6;x.strokeRect(4,4,248,88);
  x.fillStyle='#ffd166';x.font='800 54px system-ui,sans-serif';x.textAlign='center';x.fillText('MEBI',128,66);return new THREE.CanvasTexture(c)})();
put(hall,new THREE.Mesh(new THREE.PlaneGeometry(5.4,2),new THREE.MeshBasicMaterial({map:plq})),0,10.3,-11.95);
const lants=[];[-9.5,-3.2,3.2,9.5].forEach((x,i)=>{const g=new THREE.Group();g.position.set(x,7.4,-9.2);hall.add(g);
  put(g,new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.8,4),tm(0x7a4a1d)),0,-.4,0);put(g,mk(SP(.6),0xff6b5a,1.05,0x7a1a10),0,-1.2,0,[.85,1.1,.85]);put(g,mk(new THREE.CylinderGeometry(.3,.3,.18,8),0xd9a441),0,-.62,0);lants.push({g,ph:i*1.3})});
const hallLight=new THREE.PointLight(0xffc27a,1.15,26);hallLight.position.set(0,5.5,-18);S.add(hallLight);

// ===== tượng Phật chibi v2 (theo ảnh mẫu: Phật nhí đầu xoắn ốc, chắp tay, áo cam, hoa đại, lá lớn) =====
const bud=new THREE.Group();bud.position.set(0,H0,-21.4);bud.scale.setScalar(.8);S.add(bud);
const up=new THREE.Group();bud.add(up); // phần thân trên: thở + đung đưa nhẹ
const SKN=0xf6c9a4,SKD=0xe0a07a,SKL=0xfbdcc0,ORG=0xf57c2a,ORD=0xd8560f,ORL=0xffa04f,HA1=0x6c5f73,HA2=0x8f8399,HAD=0x3d3347;
const U1=new THREE.SphereGeometry(1,28,20),Y3=new THREE.Vector3(0,1,0),Z3=new THREE.Vector3(0,0,1);
const bm=(c,x,y,z,sx,sy,sz,rot,o)=>put(bud,mk(U1,c,o),x,y,z,[sx,sy,sz],rot);
const um=(c,x,y,z,sx,sy,sz,rot,o)=>put(up,mk(U1,c,o),x,y,z,[sx,sy,sz],rot);
// chi (tay/chân) là elip nối hai điểm
function limb(par,c,a,b,r,o){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A),L=d.length();
  const m=mk(U1,c,o);m.position.copy(A).add(B).multiplyScalar(.5);m.scale.set(r,L/2+r*.6,r);m.quaternion.setFromUnitVectors(Y3,d.normalize());par.add(m);return m}
// ống cong (đường mép áo, nếp áo, cành hoa)
function tube(par,pts,r,c,seg){const m=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p))),seg||16,r,6,false),tm(c));par.add(m);return m}

// --- đài sen: bệ tám cạnh + hai hàng cánh sen hồng ---
put(bud,mk(new THREE.CylinderGeometry(3.4,3.6,.45,8),0xd9c7a4,1.02),0,.22,0);
put(bud,mk(new THREE.CylinderGeometry(3.1,3.3,.5,32),0xe9dcc2,1.02),0,.65,0);
[[18,3.05,.95,0,0xff9cc6,.62,1.3],[14,2.4,1.15,.22,0xffb8d6,.55,1.2]].forEach(([n,rad,y,off,col,w,h],r)=>{
  for(let i=0;i<n;i++){const a=i/n*TAU+off,g=new THREE.Group();g.position.set(Math.cos(a)*rad,y,Math.sin(a)*rad);g.rotation.y=Math.PI/2-a;bud.add(g);
    const p=mk(U1,col,1.05);p.scale.set(w,h,.28);p.rotation.x=.45+r*.12;p.position.y=h*.45;g.add(p)}});

// --- chân xếp bằng, áo cam trải rộng có nếp ---
bm(ORG,0,1.55,.1,2.75,.85,2.0);
bm(ORG,-2.15,1.5,.95,1.0,.6,1.15,[0,.35,0]);bm(ORG,2.15,1.5,.95,1.0,.6,1.15,[0,-.35,0]);
bm(ORD,0,1.35,1.5,2.2,.45,.85);
for(let i=-3;i<=3;i++){const x=i*.5,z=1.2+Math.abs(i)*.13,t=Math.max(0,1-(x/2.75)**2-((z-.1)/2.0)**2),y=1.55+.85*Math.sqrt(t)+.02;
  bm(i%2?ORD:ORL,x,y,z,.11,.08,.62,[0,-i*.1,0],0)}
// bàn chân lộ lòng bàn chân, có năm ngón
{const g=new THREE.Group();g.position.set(-1.0,1.78,1.95);g.rotation.set(-.45,.3,.05);bud.add(g);
  const sole=mk(U1,SKL,1.05);sole.scale.set(.58,.15,.92);g.add(sole);
  for(let i=0;i<5;i++){const t=mk(U1,SKL,1.12);t.scale.setScalar(i===4?.15:.115);t.position.set(-.36+i*.18,0,.86-Math.abs(i-2)*.07);g.add(t)}}

// --- thân: vai trái để trần, áo cam phủ vai phải, mép áo + nếp ---
um(SKN,0,2.85,0,1.42,1.55,1.18);
put(up,mk(new THREE.SphereGeometry(1,28,18,Math.PI/2-.55,Math.PI+.55),ORG,1.02),0,2.85,0,[1.5,1.62,1.25]);
const shp=(ph,th,k)=>[-Math.cos(ph)*Math.sin(th)*1.5*k,2.85+Math.cos(th)*1.62*k,Math.sin(ph)*Math.sin(th)*1.25*k],PH0=Math.PI/2-.55;
tube(up,[.5,.9,1.3,1.7,2.1].map(th=>shp(PH0,th,1.03)),.07,ORD,20);
[.25,.65,1.1,1.6].forEach(d=>tube(up,[.7,1.1,1.5,1.9,2.2].map(th=>shp(Math.PI/2+d,th,1.025)),.035,ORD,18));
um(ORG,0,2.15,.05,1.52,.85,1.22);
put(up,mk(new THREE.TorusGeometry(1.32,.15,8,26),ORD,1.04),0,2.2,.05,[1,.92,1],[Math.PI/2,0,0]);
um(ORG,1.3,3.55,.05,.8,.62,.75);

// --- tay: trái để trần, phải trong tay áo cam; hai bàn tay chắp trước ngực ---
limb(up,SKN,[-1.25,3.5,.1],[-1.75,2.45,.6],.42);limb(up,SKN,[-1.75,2.45,.6],[-.4,2.9,1.4],.36);
limb(up,ORG,[1.25,3.5,.1],[1.8,2.45,.6],.52);limb(up,ORG,[1.8,2.45,.6],[.4,2.9,1.4],.46);
[-1,1].forEach(s=>{um(SKN,s*.12,3.0,1.42,.25,.64,.3,[0,0,-s*.05]);um(SKN,s*.14,2.72,1.72,.1,.2,.1,[-.4,0,0],0)});

// --- đầu to chibi ---
const HC=4.85,HX=1.78,HY=1.64,HZ=1.56;
um(SKN,0,HC,0,HX,HY,HZ);
const fz=(x,y)=>HZ*Math.sqrt(Math.max(0,1-(x/HX)**2-((y-HC)/HY)**2));
// nhóm gắn trên mặt đầu, hướng theo pháp tuyến
function fg(x,y,off){const z=fz(x,y),n=new THREE.Vector3(x/(HX*HX),(y-HC)/(HY*HY),z/(HZ*HZ)).normalize(),g=new THREE.Group();
  g.position.set(x,y,z).addScaledVector(n,off);g.quaternion.setFromUnitVectors(Z3,n);up.add(g);return g}
const INK=new THREE.MeshBasicMaterial({color:0x4a2d2a}),BRW=new THREE.MeshBasicMaterial({color:0x7d6459}),
  BLUSH=new THREE.MeshBasicMaterial({color:0xff8f86,transparent:true,opacity:.55,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
[-1,1].forEach(s=>{
  // mắt nhắm (cung cong xuống), đuôi mi, lông mày
  const g=fg(s*.68,HC-.2,.03);
  const arc=new THREE.Mesh(new THREE.TorusGeometry(.3,.048,6,18,Math.PI),INK);arc.scale.set(1,.5,.6);arc.rotation.z=Math.PI;g.add(arc);
  const lash=new THREE.Mesh(new THREE.BoxGeometry(.15,.04,.04),INK);lash.position.set(s*.31,-.06,0);lash.rotation.z=-s*.55;g.add(lash);
  const brow=new THREE.Mesh(U1,BRW);brow.scale.set(.34,.045,.04);brow.position.set(0,.32,0);brow.rotation.z=-s*.12;g.add(brow);
  // má hồng

  // tai dài
  um(SKN,s*(HX-.02),HC-.25,-.05,.24,.62,.3,[0,0,s*.1]);um(SKN,s*(HX+.04),HC-.9,0,.17,.5,.2,[0,0,s*.08]);um(SKD,s*(HX+.2),HC-.3,.1,.05,.35,.1,null,0)});
{const n=new THREE.Mesh(U1,tm(SKD));n.scale.set(.1,.075,.08);fg(0,HC-.55,0).add(n);
  const g=fg(0,HC-.92,.01),up1=new THREE.Mesh(U1,tm(0xd9484f)),lo=new THREE.Mesh(U1,tm(0xea6a63));

// --- tóc xoắn ốc: mỗi lọn là một cục tròn có vòng xoáy nổi, gộp thành 1 mesh cho nhẹ ---
function mergeG(items){let np=0,ni=0;items.forEach(it=>{np+=it.g.attributes.position.count;ni+=it.g.index.count});
  const Pp=new Float32Array(np*3),Nn=new Float32Array(np*3),Cc=new Float32Array(np*3),I=new Uint32Array(ni);let po=0,io=0;
  items.forEach(it=>{const g=it.g.clone().applyMatrix4(it.m),n=g.attributes.position.count,ix=g.index.array,c=new THREE.Color(it.c);
    Pp.set(g.attributes.position.array,po*3);Nn.set(g.attributes.normal.array,po*3);
    for(let i=0;i<n;i++){Cc[(po+i)*3]=c.r;Cc[(po+i)*3+1]=c.g;Cc[(po+i)*3+2]=c.b}
    for(let i=0;i<ix.length;i++)I[io+i]=ix[i]+po;po+=n;io+=ix.length});
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(Pp,3));g.setAttribute('normal',new THREE.BufferAttribute(Nn,3));
  g.setAttribute('color',new THREE.BufferAttribute(Cc,3));g.setIndex(new THREE.BufferAttribute(I,1));return g}
const CR=.27,spPts=[];for(let i=0;i<=26;i++){const t=i/26,a=t*TAU*1.9+.4,r=.025+t*.17;spPts.push(new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r,Math.sqrt(Math.max(0,CR*CR-r*r))+.012))}
const spiG=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(spPts),40,.026,5,false),crG=new THREE.SphereGeometry(CR,10,8);
function hairCurls(cx,cy,cz,rx,ry,rz,N,keep,sc,seed){const items=[],m=new THREE.Matrix4(),q=new THREE.Quaternion(),qz=new THREE.Quaternion(),s=new THREE.Vector3(sc,sc,sc),pos=new THREE.Vector3();let k=0;
  for(let i=0;i<N;i++){const ny=1-2*(i+.5)/N,rr=Math.sqrt(1-ny*ny),a=i*2.39996+seed,nx=rr*Math.cos(a),nz=rr*Math.sin(a);if(!keep(nx,ny,nz))continue;

function audio(){if(M.ac){if(M.ac.state==='suspended')M.ac.resume();return M.ac}
  let ac;try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}M.ac=ac;
  M.master=ac.createGain();M.master.gain.value=$('vol').value/100*.9;M.master.connect(ac.destination);
  const len=ac.sampleRate*3.4,buf=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.7)}
  const cv=ac.createConvolver();cv.buffer=buf;const wet=ac.createGain();wet.gain.value=.6;cv.connect(wet).connect(M.master);
  M.bus=ac.createGain();M.bus.connect(M.master);M.bus.connect(cv);M.mus=ac.createGain();M.mus.gain.value=musOn?1:0;M.mus.connect(M.bus);M.sfx=ac.createGain();M.sfx.gain.value=sfxOn?1:0;M.sfx.connect(M.bus);return ac}
// Trình phát YouTube chính thức (iframe API). Phải hiển thị ở góc màn hình, YouTube không cho ẩn để chỉ phát tiếng.
function ytFallback(why){if(!ytMode&&why)toast(why)}
function initYT(){if(ytTried)return;ytTried=true;$('ytbox').style.display='block';
  const to=setTimeout(()=>{if(!ytMode){toast('Trình duyệt chặn tự phát – bấm nút 🎵 Nhạc để bật')}},8000);
  window.onYouTubeIframeAPIReady=()=>{yt=new YT.Player('ytp',{width:Math.min(280,Math.round(innerWidth*.55)),height:Math.min(158,Math.round(innerWidth*.31)),videoId:YT_ID,
    playerVars:{autoplay:1,loop:1,playlist:YT_ID,controls:1,rel:0,modestbranding:1,playsinline:1,origin:location.origin},
    events:{onReady:e=>{e.target.setVolume(+$('vol').value);if(musOn)e.target.playVideo();else try{e.target.playVideo()}catch(x){}},
      onStateChange:e=>{if(e.data===1){ytMode=true;clearTimeout(to);setMus(true)}else if(e.data===2||e.data===0)setMus(false)},
      onError:()=>{clearTimeout(to);ytFallback('Video không cho nhúng – mở trực tiếp trên YouTube để nghe')}}})};
  const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';sc.onerror=()=>{clearTimeout(to);$('ytbox').style.display='none';ytFallback('Không tải được YouTube – kiểm tra mạng rồi tải lại trang')};document.head.appendChild(sc)}
function env(osc,out,v,att,dec){const ac=M.ac,g=ac.createGain();g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.linearRampToValueAtTime(v,ac.currentTime+att);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+att+dec);osc.connect(g).connect(out);osc.start();osc.stop(ac.currentTime+att+dec+.1)}
function osc(f,type,out,v,att,dec,det){if(!M.ac)return;const o=M.ac.createOscillator();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;env(o,out,v,att,dec)}
function sfx(f,d,v,type){if(!M.ac)return;osc(f,type||'sine',M.sfx,v,.004,d)}
function bell(v){sfx(330,3.4,.09*v);sfx(660,2.6,.045*v);sfx(990,1.8,.025*v)}
function moSound(v){sfx(220,.14,.16*v,'triangle');sfx(150,.22,.1*v,'triangle')}

// ================= mạng (hiện diện) =================
const pub=()=>({x:+me.x.toFixed(2),z:+me.z.toFixed(2),s:me.st,f:+me.f.toFixed(2)});
function addOther(p){if(others.has(p.id))return;const o=newPerson({id:p.id,x:p.x,z:p.z,tx:p.x,tz:p.z,f:p.f||0,tf:p.f||0,st:p.s||0,col:p.col,look:p.look|0,name:p.name||'Khách'});o.y=gY(p.x,p.z);others.set(p.id,o)}
function drop(id){const o=others.get(id);if(o){S.remove(o.ch.root);others.delete(id)}}
function onMsg(m){
  if(m.t==='err'){if(m.retry&&room<8){room++;try{ws.onclose=null;ws.close()}catch(e){}connect()}else enterOffline()}
  else if(m.t==='list'){[...others.keys()].forEach(drop);m.list.forEach(addOther);enter()}
  else if(m.t==='in')addOther(m.p);else if(m.t==='out')drop(m.id);
  else if(m.t==='p'){const o=others.get(m.id);if(o){o.tx=m.x;o.tz=m.z;o.st=m.s;o.tf=m.f}}
  else if(m.t==='ev'){if(m.k==='h')addStick();else if(m.k==='m')moSound(.35);else if(m.k==='b'&&T-lastBell>4){lastBell=T;bell(.3)}}}
function connect(){$('sm').textContent='Đang kết nối…';let opened=false;
  try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/__game/chua-mebi/ws?r='+room)}catch(e){enterOffline();return}
  ws.onopen=()=>{opened=true;ws.send(JSON.stringify({t:'join',name:me.name,col:'#'+me.col.toString(16).padStart(6,'0'),look:me.look}))};
  ws.onmessage=e=>onMsg(JSON.parse(e.data));
  ws.onclose=()=>{if(!opened)enterOffline();else if(playing){$('mode').textContent='Mất kết nối – đang ngồi một mình'}}}
function enterOffline(){if(playing)return;offline=true;ws=null;
  [['Thiện',-4.5,-2.5,0xa8d8ff,1],['Minh Tâm',5,-3.8,0xc9b6f2,2],['An',-1.8,-13,0xffd9a0,0],['Hạnh',7.5,5,0xffc2b0,1]].forEach(([n,x,z,c,l],i)=>{
    addOther({id:'n'+i,x,z,s:1,f:0,col:c,look:l,name:n});const o=others.get('n'+i);o.npc=1;o.f=o.tf=faceBud(o);o.nb=12+i*7});enter()}
function enter(){if(playing)return;playing=true;$('start').style.display='none';$('mode').textContent=offline?'Chế độ một mình (có vài người bạn ngồi cùng)':'Đang ngồi cùng mọi người'}
$('go').onclick=()=>{audio();initYT();me.name=($('nm').value.trim()||'Khách'+(Math.random()*99|0)).slice(0,14);me.col=COLS[Math.random()*COLS.length|0];me.look=Math.random()*3|0;
  S.remove(me.ch.root);Object.assign(me,newPerson({id:'me',col:me.col,look:me.look,name:me.name,x:0,z:12}));connect()};

// ================= vòng lặp =================
function update(dt){T+=dt;incCd=Math.max(0,incCd-dt);
  const ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+jx,iz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+jy,m=Math.hypot(ix,iz);
  me.moving=false;
  if(playing&&me.st===0&&m>.12){const k=Math.min(1,m),fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw),nx=ix/Math.max(1,m),nz=iz/Math.max(1,m);
    const dx=rx*nx+fx*-nz,dz=rz*nx+fz*-nz;me.x+=dx*5.2*k*dt;me.z+=dz*5.2*k*dt;me.tf=Math.atan2(dx,dz);me.f=me.tf;me.moving=true;
    const inHall=me.z<-10.6;me.x=Math.max(inHall?-11:-16,Math.min(inHall?11:16,me.x));me.z=Math.max(-14.6,Math.min(18,me.z));
    const bx=me.x-BXZ[0],bz=me.z-BXZ[1],bd=Math.hypot(bx,bz);if(bd<1.7){me.x=BXZ[0]+bx/bd*1.7;me.z=BXZ[1]+bz/bd*1.7}
    const px=me.x-14.5,pz=me.z-10,pd=Math.hypot(px,pz);if(pd<5.2){me.x=14.5+px/pd*5.2;me.z=10+pz/pd*5.2}}
  else if(m>.25&&me.st===1)me.st=0;
  me.y=lerp(me.y,gY(me.x,me.z),Math.min(1,dt*14));
  if(me.st===2){me.bt+=dt;if(me.bt>=2.8){me.st=me.prev||0;me.bt=0;bows++;$('bows').textContent=bows;toast('🙏 +1 công đức')}}
  sendT+=dt;if(ws&&ws.readyState===1&&playing&&sendT>.1){sendT=0;send(Object.assign({t:'p'},pub()))}
  others.forEach(o=>{if(o.npc){o.nb-=dt;if(o.nb<=0){o.nb=22+Math.random()*25;o.st=2;o.bt=0}if(o.st===2&&o.bt>=2.8){o.st=1;o.bt=0}}
    const dx=o.tx-o.x,dz=o.tz-o.z;o.moving=Math.hypot(dx,dz)>.05;o.x+=dx*Math.min(1,dt*9);o.z+=dz*Math.min(1,dt*9);o.y=lerp(o.y,gY(o.x,o.z),Math.min(1,dt*10));
    if(!o.npc)o.f=o.tf;if(o.st===2)o.bt+=dt});
  // hương + khói
  for(let i=sticks.length-1;i>=0;i--){const s=sticks[i];s.t+=dt;const k=Math.max(0,1-s.t/90);s.m.scale.y=Math.max(.05,k);s.tip.position.y=1.62+1.1*k+.06;
    if(s.t<90&&Math.random()<dt*9){const p=smk.find(q=>q.a>=q.l);if(p){p.x=s.x;p.y=s.tip.position.y+.1;p.z=s.z;p.a=0;p.l=4+Math.random()*2;p.vx=(Math.random()-.5)*.25}}
    if(s.t>=90){S.remove(s.m,s.tip);sticks.splice(i,1)}}
  smk.forEach((p,i)=>{if(p.a<p.l){p.a+=dt;p.y+=dt*.75;p.x+=p.vx*dt+Math.sin(T*1.5+p.y)*.004;SM.pos.set([p.x,p.y,p.z],i*3)}else SM.pos.set([0,-99,0],i*3)});SM.p.geometry.attributes.position.needsUpdate=true;
  ptl.forEach((p,i)=>{p.y-=dt*.55;p.x+=Math.sin(T*.8+p.p)*dt*.5+dt*.12;if(p.y<0){p.y=12;p.x=(Math.random()-.5)*50}PT.pos.set([p.x,p.y,p.z],i*3)});PT.p.geometry.attributes.position.needsUpdate=true;
  ffl.forEach((p,i)=>{FF.pos.set([p.x+Math.sin(T*.6+p.p)*1.2,p.y+Math.sin(T*1.1+p.p)*.5,p.z+Math.cos(T*.5+p.p)*1.2],i*3)});FF.p.geometry.attributes.position.needsUpdate=true;
  // ánh sáng sống
  budAnim(T);flames.forEach((f,i)=>{f.scale.set(1,1+.25*Math.sin(T*9+i*2),1);f.position.x+=0});hallLight.intensity=1.1+.12*Math.sin(T*2.2);haloG.material.opacity=.3+.08*Math.sin(T*1.5);
  lants.forEach(l=>{l.g.rotation.z=Math.sin(T*1.1+l.ph)*.05});
  $('cnt').textContent=others.size+1;$('bInc').disabled=!near()||incCd>0;$('bSit').textContent=me.st===1?'🚶 Đứng dậy':'🧘 Ngồi';$('bBow').disabled=me.st===2}
function frame(now){const dt=Math.min((now-frame.l)/1000||0,.05);frame.l=now;update(dt);
  place(me,dt,T);others.forEach(o=>place(o,dt,T));
  if(!playing)yaw=Math.sin(T*.12)*.7;camYaw=lerp(camYaw,yaw,Math.min(1,dt*8));
  const tgt=playing?new THREE.Vector3(me.x,me.y+1.4,me.z):new THREE.Vector3(0,3.2,-6),cp=playing?.52:.3,d=playing?dist:30;
  C.position.set(tgt.x+Math.sin(camYaw)*d*Math.cos(cp),tgt.y+d*Math.sin(cp)+1,tgt.z+Math.cos(camYaw)*d*Math.cos(cp));
  if(playing)C.lookAt(tgt.x-Math.sin(camYaw)*3,tgt.y,tgt.z-Math.cos(camYaw)*3);else C.lookAt(tgt);
  R.render(S,C);requestAnimationFrame(frame)}
frame.l=performance.now();requestAnimationFrame(frame);
</script></body></html>
