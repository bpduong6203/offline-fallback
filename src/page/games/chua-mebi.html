<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Chùa MEBI 3D – ngồi cùng nhau</title>
    <style>
      :root {
        --ink: #3b2f5c;
        --card: rgba(255, 255, 255, 0.93);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --ink: #f3eaff;
          --card: rgba(34, 28, 66, 0.94);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --ink: #f3eaff;
        --card: rgba(34, 28, 66, 0.94);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
        background: linear-gradient(#7d6ddb, #f0b4d8 58%, #ffdcb8);
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
        z-index: 0;
        touch-action: none;
      }
      .card {
        position: fixed;
        z-index: 10;
        background: var(--card);
        border-radius: 18px;
        padding: 10px 16px;
        font-weight: 700;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12);
      }
      #top {
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        left: 10px;
        line-height: 1.5;
        font-size: 14px;
      }
      #acts {
        position: fixed;
        z-index: 10;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        width: 96vw;
      }
      button {
        font: inherit;
        font-weight: 800;
        border: 0;
        border-radius: 14px;
        padding: 9px 14px;
        background: #ff7eb6;
        color: #fff;
        cursor: pointer;
        box-shadow: 0 4px 0 #d2588f;
      }
      button.alt {
        background: #8e7bff;
        box-shadow: 0 4px 0 #6a58cc;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #vol {
        width: 90px;
        accent-color: #8e7bff;
      }
      #hint {
        bottom: calc(env(safe-area-inset-bottom, 0px) + 82px);
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        white-space: nowrap;
        opacity: 0.92;
        pointer-events: none;
        padding: 6px 12px;
      }
      #start {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        min-width: 290px;
        padding: 20px 24px;
      }
      #start h2 {
        margin: 0 0 6px;
      }
      #start p {
        margin: 0 0 12px;
        font-weight: 600;
        font-size: 14px;
        opacity: 0.85;
      }
      #start input {
        font: inherit;
        font-weight: 700;
        padding: 9px 12px;
        border-radius: 12px;
        border: 2px solid #ffb3d1;
        margin: 4px 0 10px;
        width: 200px;
        text-align: center;
        background: #fff;
        color: #3b2f5c;
      }
      #toast {
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        white-space: nowrap;
      }
      #ytbox {
        left: -400px;
        bottom: 0;
        width: 220px;
        height: 220px;
        padding: 0;
        opacity: 0;
        pointer-events: none;
        box-shadow: none;
        background: none;
        line-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="top" class="card">
      🧘 <span id="cnt">1</span> người trong chùa<br />🙏 Công đức:
      <span id="bows">0</span><br /><span
        id="mode"
        style="font-size: 12px; opacity: 0.8"
      ></span>
    </div>
    <div id="toast" class="card"></div>
    <div id="ytbox" class="card" style="display: none">
      <div id="ytp"></div>
    </div>
    <div id="hint" class="card">
      WASD / mũi tên: đi · Space: ngồi/đứng · B: lạy · H: thắp hương (lại gần lư
      hương) · M: gõ mõ · kéo chuột: xoay góc nhìn
    </div>
    <div id="acts">
      <button id="bSit">🧘 Ngồi</button><button id="bBow">🙏 Lạy</button
      ><button id="bInc" class="alt">🪔 Thắp hương</button
      ><button id="bMo" class="alt">🪘 Gõ mõ</button>
      <button id="bMus" class="alt">🎵 Nhạc: tắt</button
      ><input
        id="vol"
        type="range"
        min="0"
        max="100"
        value="55"
        aria-label="Âm lượng"
      /><button id="bSnd" class="alt">🔔 Âm: bật</button>
    </div>
    <div id="start" class="card">
      <h2>🪷 Chùa MEBI</h2>
      <p>Ngồi lại một chút, không cần nói gì.</p>
      <input id="nm" maxlength="14" placeholder="Tên của bạn" /><br /><button
        id="go"
      >
        Vào chùa
      </button>
      <div id="sm" style="font-size: 12px; margin-top: 8px; opacity: 0.8"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/merit.js"></script>
    <script>
      const $ = (i) => document.getElementById(i),
        TAU = Math.PI * 2,
        lerp = (a, b, k) => a + (b - a) * k;

      // ================= cảnh 3D =================
      const R = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      R.setPixelRatio(Math.min(devicePixelRatio, 2));
      R.setSize(innerWidth, innerHeight);
      document.body.insertBefore(R.domElement, document.body.firstChild);
      const S = new THREE.Scene();
      S.fog = new THREE.Fog(0xf0c8dc, 60, 170);
      const C = new THREE.PerspectiveCamera(
        50,
        innerWidth / innerHeight,
        0.1,
        500,
      );
      S.add(new THREE.HemisphereLight(0xfff2ee, 0x9d8fc0, 0.5));
      const sunL = new THREE.DirectionalLight(0xffe2c4, 0.45);
      sunL.position.set(-10, 22, 14);
      S.add(sunL);
      addEventListener("resize", () => {
        R.setSize(innerWidth, innerHeight);
        C.aspect = innerWidth / innerHeight;
        C.updateProjectionMatrix();
      });
      const GRAD = new THREE.DataTexture(
        new Uint8Array([
          150, 150, 150, 255, 205, 205, 205, 255, 255, 255, 255, 255,
        ]),
        3,
        1,
        THREE.RGBAFormat,
      );
      GRAD.minFilter = GRAD.magFilter = THREE.NearestFilter;
      GRAD.needsUpdate = true;
      const tm = (c, e) =>
        new THREE.MeshToonMaterial({
          color: c,
          emissive: e || 0x000000,
          gradientMap: GRAD,
        });
      const OM = new THREE.MeshBasicMaterial({
        color: 0x2b2147,
        side: THREE.BackSide,
      });
      function mk(g, c, o, e) {
        const m = new THREE.Mesh(g, tm(c, e));
        if (o !== 0) {
          const l = new THREE.Mesh(g, OM);
          l.scale.setScalar(o || 1.05);
          m.add(l);
        }
        return m;
      }
      const GC = {};
      const SP = (r) =>
        GC["s" + r] || (GC["s" + r] = new THREE.SphereGeometry(r, 16, 12));
      function put(par, m, x, y, z, sc, rot) {
        m.position.set(x, y, z);
        if (sc) m.scale.set(sc[0], sc[1], sc[2]);
        if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
        par.add(m);
        return m;
      }
      const GCOL = 0xf4b94f,
        SKIN = 0xf8d58a;

      // nền đất, sân đá, mặt trăng, sao, núi
      put(
        S,
        new THREE.Mesh(new THREE.CircleGeometry(150, 48), tm(0xa6cf94)),
        0,
        -0.03,
        0,
        null,
        [-Math.PI / 2, 0, 0],
      );
      const tileTex = (() => {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const x = c.getContext("2d");
        x.fillStyle = "#dcc59c";
        x.fillRect(0, 0, 256, 256);
        x.strokeStyle = "#b39870";
        x.lineWidth = 5;
        x.strokeRect(0, 0, 256, 256);
        x.beginPath();
        x.moveTo(128, 0);
        x.lineTo(128, 256);
        x.moveTo(0, 128);
        x.lineTo(256, 128);
        x.stroke();
        const t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(8.5, 8);
        return t;
      })();
      put(
        S,
        new THREE.Mesh(
          new THREE.BoxGeometry(34, 0.3, 32),
          new THREE.MeshToonMaterial({ map: tileTex }),
        ),
        0,
        -0.15,
        6,
      );
      for (let i = 0; i < 7; i++) {
        const m = mk(
          new THREE.ConeGeometry(26 + (i % 3) * 6, 26 + (i % 4) * 8, 7),
          i % 2 ? 0xc3b3ee : 0xb3c4f0,
          0,
        );
        put(S, m, -90 + i * 30, 13 + (i % 4) * 4 - 6, -120 - (i % 2) * 20);
      }
      put(
        S,
        new THREE.Mesh(
          new THREE.SphereGeometry(7, 24, 16),
          new THREE.MeshBasicMaterial({ color: 0xfff6d8, fog: false }),
        ),
        42,
        52,
        -130,
      );
      put(
        S,
        new THREE.Mesh(
          new THREE.SphereGeometry(11, 24, 16),
          new THREE.MeshBasicMaterial({
            color: 0xfff6d8,
            transparent: true,
            opacity: 0.22,
            fog: false,
            depthWrite: false,
          }),
        ),
        42,
        52,
        -130,
      );
      const DOT = (() => {
        const c = document.createElement("canvas");
        c.width = c.height = 64;
        const x = c.getContext("2d"),
          g = x.createRadialGradient(32, 32, 0, 32, 32, 31);
        g.addColorStop(0, "rgba(255,255,255,1)");
        g.addColorStop(0.5, "rgba(255,255,255,.55)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        x.fillStyle = g;
        x.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(c);
      })();
      function pts(n, size, col, op, add) {
        const g = new THREE.BufferGeometry(),
          pos = new Float32Array(n * 3);
        g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        const p = new THREE.Points(
          g,
          new THREE.PointsMaterial({
            map: DOT,
            size,
            color: col,
            transparent: true,
            opacity: op,
            depthWrite: false,
            sizeAttenuation: true,
            blending: add ? THREE.AdditiveBlending : THREE.NormalBlending,
          }),
        );
        p.frustumCulled = false;
        S.add(p);
        return { p, pos, n };
      }
      const stars = pts(160, 2, 0xffffff, 0.9, true);
      stars.p.material.fog = false;
      for (let i = 0; i < 160; i++) {
        const a = Math.random() * TAU,
          e = 0.25 + Math.random() * 1.1,
          r = 210;
        stars.pos.set(
          [
            Math.cos(a) * Math.cos(e) * r,
            Math.sin(e) * r * 0.8 + 10,
            Math.sin(a) * Math.cos(e) * r * -1,
          ],
          i * 3,
        );
      }
      stars.p.geometry.attributes.position.needsUpdate = true;

      // ===== chánh điện =====
      const H0 = 0.8,
        hall = new THREE.Group();
      S.add(hall);
      put(
        hall,
        mk(new THREE.BoxGeometry(27, H0, 15), 0xe6d5ba, 1.01),
        0,
        H0 / 2,
        -17.5,
      );
      put(
        hall,
        mk(new THREE.BoxGeometry(11, 0.4, 1.4), 0xdcc9ab, 1.02),
        0,
        0.2,
        -10,
      );
      put(
        hall,
        mk(new THREE.BoxGeometry(5, 0.06, 13), 0xb23a48, 0),
        0,
        H0 + 0.03,
        -17.2,
      );
      put(
        hall,
        mk(new THREE.BoxGeometry(26, 7.4, 0.5), 0x5a2f55, 0),
        0,
        H0 + 3.7,
        -24.8,
      );
      [-1, 1].forEach((s) =>
        put(
          hall,
          mk(new THREE.BoxGeometry(0.5, 7.4, 14), 0x8a3d4a, 1.02),
          s * 12.6,
          H0 + 3.7,
          -17.5,
        ),
      );
      put(
        hall,
        new THREE.Mesh(
          new THREE.PlaneGeometry(24, 7),
          new THREE.MeshBasicMaterial({ color: 0x3a2246 }),
        ),
        0,
        H0 + 3.7,
        -24.5,
      );
      const colG = new THREE.CylinderGeometry(0.5, 0.55, 7.2, 14);
      [-11.6, -5.4, 5.4, 11.6].forEach((x) =>
        [-10.9, -24.2].forEach((z) => {
          put(hall, mk(colG, 0xc4553d), x, H0 + 3.6, z);
          put(
            hall,
            mk(new THREE.CylinderGeometry(0.7, 0.7, 0.35, 14), 0xd9a441),
            x,
            H0 + 7.3,
            z,
          );
        }),
      );
      const roofG = new THREE.ConeGeometry(0.7071, 1, 4);
      roofG.rotateY(Math.PI / 4);
      put(
        hall,
        mk(roofG, 0x4d8f8a, 1.01),
        0,
        7.8 + 1.35,
        -17.5,
        [32, 2.7, 20.5],
      );
      put(
        hall,
        mk(new THREE.BoxGeometry(18, 2.8, 11), 0xb8503f, 1.02),
        0,
        10.3,
        -17.5,
      );
      put(
        hall,
        mk(roofG, 0x4d8f8a, 1.01),
        0,
        11.7 + 1.8,
        -17.5,
        [22, 3.6, 14.5],
      );
      put(hall, mk(SP(0.7), 0xffd166), 0, 15.7, -17.5);
      [
        [-1, -1],
        [1, -1],
        [-1, 1],
        [1, 1],
      ].forEach(([sx, sz]) =>
        [
          [15.6, 10, 7.9],
          [10.6, 7, 11.8],
        ].forEach(([hx, hz, y]) =>
          put(
            hall,
            mk(new THREE.ConeGeometry(0.28, 1.3, 6), 0xffd166),
            sx * hx,
            y + 0.2,
            -17.5 + sz * hz,
            null,
            [sz * 0.5, 0, -sx * 0.5],
          ),
        ),
      );
      const plq = (() => {
        const c = document.createElement("canvas");
        c.width = 256;
        c.height = 96;
        const x = c.getContext("2d");
        x.fillStyle = "#3a1f2b";
        x.fillRect(0, 0, 256, 96);
        x.strokeStyle = "#ffd166";
        x.lineWidth = 6;
        x.strokeRect(4, 4, 248, 88);
        x.fillStyle = "#ffd166";
        x.font = "800 54px system-ui,sans-serif";
        x.textAlign = "center";
        x.fillText("MEBI", 128, 66);
        return new THREE.CanvasTexture(c);
      })();
      put(
        hall,
        new THREE.Mesh(
          new THREE.PlaneGeometry(5.4, 2),
          new THREE.MeshBasicMaterial({ map: plq }),
        ),
        0,
        10.3,
        -11.95,
      );
      const lants = [];
      [-9.5, -3.2, 3.2, 9.5].forEach((x, i) => {
        const g = new THREE.Group();
        g.position.set(x, 7.4, -9.2);
        hall.add(g);
        put(
          g,
          new THREE.Mesh(
            new THREE.CylinderGeometry(0.02, 0.02, 0.8, 4),
            tm(0x7a4a1d),
          ),
          0,
          -0.4,
          0,
        );
        put(
          g,
          mk(SP(0.6), 0xff6b5a, 1.05, 0x7a1a10),
          0,
          -1.2,
          0,
          [0.85, 1.1, 0.85],
        );
        put(
          g,
          mk(new THREE.CylinderGeometry(0.3, 0.3, 0.18, 8), 0xd9a441),
          0,
          -0.62,
          0,
        );
        lants.push({ g, ph: i * 1.3 });
      });
      const hallLight = new THREE.PointLight(0xffc27a, 0.7, 26);
      hallLight.position.set(0, 5.5, -18);
      S.add(hallLight);

      // ===== tượng Phật chibi v2 (theo ảnh mẫu: Phật nhí đầu xoắn ốc, chắp tay, áo cam, hoa đại, lá lớn) =====
      const bud = new THREE.Group();
      bud.position.set(0, H0, -21.4);
      bud.scale.setScalar(0.8);
      S.add(bud);
      const up = new THREE.Group();
      bud.add(up); // phần thân trên: thở + đung đưa nhẹ
      const SKN = 0xf6c9a4,
        SKD = 0xe0a07a,
        SKL = 0xfbdcc0,
        ORG = 0xf57c2a,
        ORD = 0xd8560f,
        ORL = 0xffa04f,
        HA1 = 0x6c5f73,
        HA2 = 0x8f8399,
        HAD = 0x3d3347;
      const U1 = new THREE.SphereGeometry(1, 28, 20),
        Y3 = new THREE.Vector3(0, 1, 0),
        Z3 = new THREE.Vector3(0, 0, 1);
      const bm = (c, x, y, z, sx, sy, sz, rot, o) =>
        put(bud, mk(U1, c, o), x, y, z, [sx, sy, sz], rot);
      const um = (c, x, y, z, sx, sy, sz, rot, o) =>
        put(up, mk(U1, c, o), x, y, z, [sx, sy, sz], rot);
      // chi (tay/chân) là elip nối hai điểm
      function limb(par, c, a, b, r, o) {
        const A = new THREE.Vector3(...a),
          B = new THREE.Vector3(...b),
          d = B.clone().sub(A),
          L = d.length();
        const m = mk(U1, c, o);
        m.position.copy(A).add(B).multiplyScalar(0.5);
        m.scale.set(r, L / 2 + r * 0.6, r);
        m.quaternion.setFromUnitVectors(Y3, d.normalize());
        par.add(m);
        return m;
      }
      // ống cong (đường mép áo, nếp áo, cành hoa)
      function tube(par, pts, r, c, seg) {
        const m = new THREE.Mesh(
          new THREE.TubeGeometry(
            new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(...p))),
            seg || 16,
            r,
            6,
            false,
          ),
          tm(c),
        );
        par.add(m);
        return m;
      }

      // --- đài sen: bệ tám cạnh + hai hàng cánh sen hồng ---
      put(
        bud,
        mk(new THREE.CylinderGeometry(3.4, 3.6, 0.45, 8), 0xd9c7a4, 1.02),
        0,
        0.22,
        0,
      );
      put(
        bud,
        mk(new THREE.CylinderGeometry(3.1, 3.3, 0.5, 32), 0xe9dcc2, 1.02),
        0,
        0.65,
        0,
      );
      [
        [18, 3.05, 0.95, 0, 0xff9cc6, 0.62, 1.3],
        [14, 2.4, 1.15, 0.22, 0xffb8d6, 0.55, 1.2],
      ].forEach(([n, rad, y, off, col, w, h], r) => {
        for (let i = 0; i < n; i++) {
          const a = (i / n) * TAU + off,
            g = new THREE.Group();
          g.position.set(Math.cos(a) * rad, y, Math.sin(a) * rad);
          g.rotation.y = Math.PI / 2 - a;
          bud.add(g);
          const p = mk(U1, col, 1.05);
          p.scale.set(w, h, 0.28);
          p.rotation.x = 0.45 + r * 0.12;
          p.position.y = h * 0.45;
          g.add(p);
        }
      });

      // --- chân xếp bằng, áo cam trải rộng có nếp ---
      bm(ORG, 0, 1.55, 0.1, 2.75, 0.85, 2.0);
      bm(ORG, -2.15, 1.5, 0.95, 1.0, 0.6, 1.15, [0, 0.35, 0]);
      bm(ORG, 2.15, 1.5, 0.95, 1.0, 0.6, 1.15, [0, -0.35, 0]);
      bm(ORD, 0, 1.35, 1.5, 2.2, 0.45, 0.85);
      for (let i = -3; i <= 3; i++) {
        const x = i * 0.5,
          z = 1.2 + Math.abs(i) * 0.13,
          t = Math.max(0, 1 - (x / 2.75) ** 2 - ((z - 0.1) / 2.0) ** 2),
          y = 1.55 + 0.85 * Math.sqrt(t) + 0.02;
        bm(i % 2 ? ORD : ORL, x, y, z, 0.11, 0.08, 0.62, [0, -i * 0.1, 0], 0);
      }
      // bàn chân lộ lòng bàn chân, có năm ngón
      {
        const g = new THREE.Group();
        g.position.set(-1.0, 1.78, 1.95);
        g.rotation.set(-0.45, 0.3, 0.05);
        bud.add(g);
        const sole = mk(U1, SKL, 1.05);
        sole.scale.set(0.58, 0.15, 0.92);
        g.add(sole);
        for (let i = 0; i < 5; i++) {
          const t = mk(U1, SKL, 1.12);
          t.scale.setScalar(i === 4 ? 0.15 : 0.115);
          t.position.set(-0.36 + i * 0.18, 0, 0.86 - Math.abs(i - 2) * 0.07);
          g.add(t);
        }
      }

      // --- thân: vai trái để trần, áo cam phủ vai phải, mép áo + nếp ---
      um(SKN, 0, 2.85, 0, 1.42, 1.55, 1.18);
      put(
        up,
        mk(
          new THREE.SphereGeometry(
            1,
            28,
            18,

      $("bInc").onclick = incense;
      $("bMo").onclick = mo;
      $("bSnd").onclick = () => {
        audio();
        sfxOn = !sfxOn;
        $("bSnd").textContent = "🔔 Âm: " + (sfxOn ? "bật" : "tắt");
        if (M.sfx) M.sfx.gain.value = sfxOn ? 1 : 0;
      };
      function setMus(on) {
        musOn = on;
        $("bMus").textContent = "🎵 Nhạc: " + (on ? "bật" : "tắt");
      }
      $("bMus").onclick = () => {
        audio();
        if (!yt || !yt.getPlayerState) {
          setMus(true);
          initYT();
          toast("Đang tải nhạc…");
          return;
        } // chưa sẵn sàng: bật ngay khi player load xong
        if (yt.getPlayerState() === 1) {
          yt.pauseVideo();
          setMus(false);
        } else {
          yt.playVideo();
          setMus(true);
        }
      }; // bấm tay = được phép phát tiếng
      $("vol").oninput = (e) => {
        const v = +e.target.value;
        if (yt && yt.setVolume) yt.setVolume(v);
        if (M.master) M.master.gain.value = (v / 100) * 0.9;
      };

      // ================= âm thanh: nhạc nền YouTube (nhúng) + hiệu ứng + nhạc dự phòng tạo bằng code =================
      const YT_ID = "HLT1c-ZYgWM";
      let yt = null,
        ytMode = false,
        ytTried = false;
      const M = { ac: null };
      function audio() {
        if (M.ac) {
          if (M.ac.state === "suspended") M.ac.resume();
          return M.ac;
        }
        let ac;
        try {
          ac = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          return null;
        }
        M.ac = ac;
        M.master = ac.createGain();
        M.master.gain.value = ($("vol").value / 100) * 0.9;
        M.master.connect(ac.destination);
        const len = ac.sampleRate * 3.4,
          buf = ac.createBuffer(2, len, ac.sampleRate);
        for (let c = 0; c < 2; c++) {
          const d = buf.getChannelData(c);
          for (let i = 0; i < len; i++)
            d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.7);
        }
        const cv = ac.createConvolver();
        cv.buffer = buf;
        const wet = ac.createGain();
        wet.gain.value = 0.6;
        cv.connect(wet).connect(M.master);
        M.bus = ac.createGain();
        M.bus.connect(M.master);
        M.bus.connect(cv);
        M.mus = ac.createGain();
        M.mus.gain.value = musOn ? 1 : 0;
        M.mus.connect(M.bus);
        M.sfx = ac.createGain();
        M.sfx.gain.value = sfxOn ? 1 : 0;
        M.sfx.connect(M.bus);
        return ac;
      }
      // Trình phát YouTube chính thức (iframe API). Phải hiển thị ở góc màn hình, YouTube không cho ẩn để chỉ phát tiếng.
      function ytFallback(why) {
        if (!ytMode && why) toast(why);
      }
      function initYT() {
        if (ytTried) return;
        ytTried = true;
        $("ytbox").style.display = "block";
        const to = setTimeout(() => {
          if (!ytMode) {
            toast("Trình duyệt chặn tự phát – bấm nút 🎵 Nhạc để bật");
          }
        }, 8000);
        window.onYouTubeIframeAPIReady = () => {
          yt = new YT.Player("ytp", {
            width: 220,
            height: 220,
            videoId: YT_ID,
            playerVars: {
              autoplay: 1,
              loop: 1,
              playlist: YT_ID,
              controls: 1,
              rel: 0,
              modestbranding: 1,
              playsinline: 1,
              origin: location.origin,
            },
            events: {
              onReady: (e) => {
                e.target.setVolume(+$("vol").value);
                if (musOn) e.target.playVideo();
                else
                  try {
                    e.target.playVideo();
                  } catch (x) {}
              },
              onStateChange: (e) => {
                if (e.data === 1) {
                  ytMode = true;
                  clearTimeout(to);
                  setMus(true);
                } else if (e.data === 2 || e.data === 0) setMus(false);
              },
              onError: () => {
                clearTimeout(to);
                ytFallback(
                  "Video không cho nhúng – mở trực tiếp trên YouTube để nghe",
                );
              },
            },
          });
        };
        const sc = document.createElement("script");
        sc.src = "https://www.youtube.com/iframe_api";
        sc.onerror = () => {
          clearTimeout(to);
          $("ytbox").style.display = "none";
          ytFallback(
            "Không tải được YouTube – kiểm tra mạng rồi tải lại trang",
          );
        };
        document.head.appendChild(sc);
      }
      function env(osc, out, v, att, dec) {
        const ac = M.ac,
          g = ac.createGain();
        g.gain.setValueAtTime(0.0001, ac.currentTime);
        g.gain.linearRampToValueAtTime(v, ac.currentTime + att);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + att + dec);
        osc.connect(g).connect(out);
        osc.start();
        osc.stop(ac.currentTime + att + dec + 0.1);
      }
      function osc(f, type, out, v, att, dec, det) {
        if (!M.ac) return;
        const o = M.ac.createOscillator();
        o.type = type;
        o.frequency.value = f;
        if (det) o.detune.value = det;
        env(o, out, v, att, dec);
      }
      function sfx(f, d, v, type) {
        if (!M.ac) return;
        osc(f, type || "sine", M.sfx, v, 0.004, d);
      }
      function bell(v) {
        sfx(330, 3.4, 0.09 * v);
        sfx(660, 2.6, 0.045 * v);
        sfx(990, 1.8, 0.025 * v);
      }
      function moSound(v) {
        sfx(220, 0.14, 0.16 * v, "triangle");
        sfx(150, 0.22, 0.1 * v, "triangle");
      }

      // ================= mạng (hiện diện) =================
      const pub = () => ({
        x: +me.x.toFixed(2),
        z: +me.z.toFixed(2),
        s: me.st,
        f: +me.f.toFixed(2),
      });
      function addOther(p) {
        if (others.has(p.id)) return;
        const o = newPerson({
          id: p.id,
          x: p.x,
          z: p.z,
          tx: p.x,
          tz: p.z,
          f: p.f || 0,
          tf: p.f || 0,
          st: p.s || 0,
          col: p.col,
          look: p.look | 0,
          name: p.name || "Khách",
        });
        o.y = gY(p.x, p.z);
        others.set(p.id, o);
      }
      function drop(id) {
        const o = others.get(id);
        if (o) {
          S.remove(o.ch.root);
          others.delete(id);
        }
      }
      function onMsg(m) {
        if (m.t === "err") {
          if (m.retry && room < 6) {
            room++;
            try {
              ws.onclose = null;
              ws.close();
            } catch (e) {}
            connect();
          } else enterOffline();
        } else if (m.t === "list") {
          [...others.keys()].forEach(drop);
          m.list.forEach(addOther);
          enter();
        } else if (m.t === "in") addOther(m.p);
        else if (m.t === "out") drop(m.id);
        else if (m.t === "p") {
          const o = others.get(m.id);
          if (o) {
            o.tx = m.x;
            o.tz = m.z;
            o.st = m.s;
            o.tf = m.f;
          }
        } else if (m.t === "ev") {
          if (m.k === "h") addStick();
          else if (m.k === "m") moSound(0.35);
          else if (m.k === "b" && T - lastBell > 4) {
            lastBell = T;
            bell(0.3);
          }
        }
      }
      function connect() {
        $("sm").textContent = "Đang kết nối…";
        let opened = false;
        try {
          ws = new WebSocket(
            (location.protocol === "https:" ? "wss://" : "ws://") +
              location.host +
              "/__game/chua-mebi/ws?r=" +
              room,
          );
        } catch (e) {
          enterOffline();
          return;
        }
        ws.onopen = () => {
          opened = true;
          ws.send(
            JSON.stringify({
              t: "join",
              name: me.name,
              col: "#" + me.col.toString(16).padStart(6, "0"),
              look: me.look,
            }),
          );
        };
        ws.onmessage = (e) => onMsg(JSON.parse(e.data));
        ws.onclose = () => {
          if (!opened) enterOffline();
          else if (playing) {
            $("mode").textContent = "Mất kết nối – đang ngồi một mình";
          }
        };
      }
      function enterOffline() {
        if (playing) return;
        offline = true;
        ws = null;
        enter();
      } // không còn nhân vật bot: mất kết nối thì ngồi một mình
      function enter() {
        if (playing) return;
        playing = true;
        $("start").style.display = "none";
        $("mode").textContent = offline
          ? "Chế độ một mình (chưa kết nối được)"
          : "Đang ngồi cùng mọi người";
      }
      $("go").onclick = () => {
        audio();
        initYT();
        me.name = (
          $("nm").value.trim() || "Khách" + ((Math.random() * 99) | 0)
        ).slice(0, 14);
        me.col = COLS[(Math.random() * COLS.length) | 0];
        me.look = (Math.random() * 3) | 0;
        S.remove(me.ch.root);
        Object.assign(
          me,
          newPerson({
            id: "me",
            col: me.col,
            look: me.look,
            name: me.name,
            x: 0,
            z: 12,
          }),
        );
        connect();
      };

      // ================= vòng lặp =================
      function update(dt) {
        T += dt;
        incCd = Math.max(0, incCd - dt);
        const ix =
            (keys.KeyD || keys.ArrowRight ? 1 : 0) -
            (keys.KeyA || keys.ArrowLeft ? 1 : 0) +
            jx,
          iz =
            (keys.KeyS || keys.ArrowDown ? 1 : 0) -
            (keys.KeyW || keys.ArrowUp ? 1 : 0) +
            jy,
          m = Math.hypot(ix, iz);
        me.moving = false;
        if (playing && me.st === 0 && m > 0.12) {
          const k = Math.min(1, m),
            fx = -Math.sin(camYaw),
            fz = -Math.cos(camYaw),
            rx = Math.cos(camYaw),
            rz = -Math.sin(camYaw),
            nx = ix / Math.max(1, m),
            nz = iz / Math.max(1, m);
          const dx = rx * nx + fx * -nz,
            dz = rz * nx + fz * -nz;
          me.x += dx * 5.2 * k * dt;
          me.z += dz * 5.2 * k * dt;
          me.tf = Math.atan2(dx, dz);
          me.f = me.tf;
          me.moving = true;
          const inHall = me.z < -10.6;
          me.x = Math.max(inHall ? -11 : -16, Math.min(inHall ? 11 : 16, me.x));
          me.z = Math.max(-14.6, Math.min(18, me.z));
          const bx = me.x - BXZ[0],
            bz = me.z - BXZ[1],
            bd = Math.hypot(bx, bz);
          if (bd < 1.7) {
            me.x = BXZ[0] + (bx / bd) * 1.7;
            me.z = BXZ[1] + (bz / bd) * 1.7;
          }
          const px = me.x - 14.5,
            pz = me.z - 10,
            pd = Math.hypot(px, pz);
          if (pd < 5.2) {
            me.x = 14.5 + (px / pd) * 5.2;
            me.z = 10 + (pz / pd) * 5.2;
          }
        } else if (m > 0.25 && me.st === 1) me.st = 0;
        me.y = lerp(me.y, gY(me.x, me.z), Math.min(1, dt * 14));
        if (me.st === 2) {
          me.bt += dt;
          if (me.bt >= 2.8) {
            me.st = me.prev || 0;
            me.bt = 0;
            changeMerit(1);
            toast("🙏 +1 công đức");
          }
        }
        sendT += dt;
        if (ws && ws.readyState === 1 && playing && sendT > 0.1) {
          sendT = 0;
          send(Object.assign({ t: "p" }, pub()));
        }
        others.forEach((o) => {
          if (o.npc) {
            o.nb -= dt;
            if (o.nb <= 0) {
              o.nb = 22 + Math.random() * 25;
              o.st = 2;
              o.bt = 0;
            }
            if (o.st === 2 && o.bt >= 2.8) {
              o.st = 1;
              o.bt = 0;
            }
          }
          const dx = o.tx - o.x,
            dz = o.tz - o.z;
          o.moving = Math.hypot(dx, dz) > 0.05;
          o.x += dx * Math.min(1, dt * 9);
          o.z += dz * Math.min(1, dt * 9);
          o.y = lerp(o.y, gY(o.x, o.z), Math.min(1, dt * 10));
          if (!o.npc) o.f = o.tf;
          if (o.st === 2) o.bt += dt;
        });
        // hương + khói
        for (let i = sticks.length - 1; i >= 0; i--) {
          const s = sticks[i];
          s.t += dt;
          const k = Math.max(0, 1 - s.t / 90);
          s.m.scale.y = Math.max(0.05, k);
          s.tip.position.y = 1.62 + 1.1 * k + 0.06;
          if (s.t < 90 && Math.random() < dt * 9) {
            const p = smk.find((q) => q.a >= q.l);
            if (p) {
              p.x = s.x;
              p.y = s.tip.position.y + 0.1;
              p.z = s.z;
              p.a = 0;
              p.l = 4 + Math.random() * 2;
              p.vx = (Math.random() - 0.5) * 0.25;
            }
          }
          if (s.t >= 90) {
            S.remove(s.m, s.tip);
            sticks.splice(i, 1);
          }
        }
        smk.forEach((p, i) => {
          if (p.a < p.l) {
            p.a += dt;
            p.y += dt * 0.75;
            p.x += p.vx * dt + Math.sin(T * 1.5 + p.y) * 0.004;
            SM.pos.set([p.x, p.y, p.z], i * 3);
          } else SM.pos.set([0, -99, 0], i * 3);
        });
        SM.p.geometry.attributes.position.needsUpdate = true;
        ptl.forEach((p, i) => {
          p.y -= dt * 0.55;
          p.x += Math.sin(T * 0.8 + p.p) * dt * 0.5 + dt * 0.12;
          if (p.y < 0) {
            p.y = 12;
            p.x = (Math.random() - 0.5) * 50;
          }
          PT.pos.set([p.x, p.y, p.z], i * 3);
        });
        PT.p.geometry.attributes.position.needsUpdate = true;
        ffl.forEach((p, i) => {
          FF.pos.set(
            [
              p.x + Math.sin(T * 0.6 + p.p) * 1.2,
              p.y + Math.sin(T * 1.1 + p.p) * 0.5,
              p.z + Math.cos(T * 0.5 + p.p) * 1.2,
            ],
            i * 3,
          );
        });
        FF.p.geometry.attributes.position.needsUpdate = true;
        // ánh sáng sống
        budAnim(T);
        flames.forEach((f, i) => {
          f.scale.set(1, 1 + 0.25 * Math.sin(T * 9 + i * 2), 1);
          f.position.x += 0;
        });
        hallLight.intensity = 0.68 + 0.08 * Math.sin(T * 2.2);
        haloG.material.opacity = 0.3 + 0.08 * Math.sin(T * 1.5);
        lants.forEach((l) => {
          l.g.rotation.z = Math.sin(T * 1.1 + l.ph) * 0.05;
        });
        $("cnt").textContent = others.size + 1;
        $("bInc").disabled = !near() || incCd > 0;
        $("bSit").textContent = me.st === 1 ? "🚶 Đứng dậy" : "🧘 Ngồi";
        $("bBow").disabled = me.st === 2;
      }
      function frame(now) {
        const dt = Math.min((now - frame.l) / 1000 || 0, 0.05);
        frame.l = now;
        update(dt);
        for (const f of GA) f(T, dt);
        place(me, dt, T);
        others.forEach((o) => place(o, dt, T));
        if (!playing) yaw = Math.sin(T * 0.12) * 0.7;
        camYaw = lerp(camYaw, yaw, Math.min(1, dt * 8));
        const tgt = playing
            ? new THREE.Vector3(me.x, me.y + 1.4, me.z)
            : new THREE.Vector3(0, 3.2, -6),
          cp = playing ? 0.52 : 0.3,
          d = playing ? dist : 30;
        C.position.set(
          tgt.x + Math.sin(camYaw) * d * Math.cos(cp),
          tgt.y + d * Math.sin(cp) + 1,
          tgt.z + Math.cos(camYaw) * d * Math.cos(cp),
        );
        if (playing)
          C.lookAt(
            tgt.x - Math.sin(camYaw) * 3,
            tgt.y,
            tgt.z - Math.cos(camYaw) * 3,
          );
        else C.lookAt(tgt);
        R.render(S, C);
        requestAnimationFrame(frame);
      }
      frame.l = performance.now();
      requestAnimationFrame(frame);
    </script>
  </body>
