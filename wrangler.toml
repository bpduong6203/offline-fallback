name = "offline-fallback"
main = "worker.js"
compatibility_date = "2025-01-01"

# Route wildcard cho toàn bộ subdomain mebidev.site
routes = [
  { pattern = "*.mebidev.site/*", zone_name = "mebidev.site" }
]

# Nếu trước đây bạn đã tắt địa chỉ *.workers.dev cho Worker này thì bỏ dấu # ở dòng dưới
# workers_dev = false

# Bi-a và Caro (chuyển tin nhắn giữa 2 người)
[[durable_objects.bindings]]
name = "POOL"
class_name = "PoolRoom"

# Ma sói (server giữ vai trò và luật chơi)
[[durable_objects.bindings]]
name = "WOLF"
class_name = "WolfRoom"

# Migration cũ giữ nguyên, chỉ THÊM v2
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PoolRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["WolfRoom"]

# Bomb Arena: phòng tối đa 4 người, server xử lý luật chơi.
[[durable_objects.bindings]]
name = "BOMB"
class_name = "BombRoom"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["BombRoom"]

# Stickman Showdown: server-authoritative room for two players.
[[durable_objects.bindings]]
name = "STICKMAN"
class_name = "StickmanRoom"

# Bang Bang 3v3 global ready queue and authoritative match simulation.
[[durable_objects.bindings]]
name = "BANGBANG"
class_name = "BangBangQueue"

# Tiến Lên Miền Nam: server-authoritative room cho tối đa 4 người
[[durable_objects.bindings]]
name = "TIENLEN"
class_name = "TienLenRoom"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["StickmanRoom"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["TienLenRoom"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["BangBangQueue"]

# UNO Arena: server-authoritative room cho 2 đến 4 người
[[durable_objects.bindings]]
name = "UNO"
class_name = "UnoRoom"

[[r2_buckets]]
# Existing bucket: public image reads are served through /__assets/images/ only.
binding = "IMAGES"
bucket_name = "offline-fallback-images"

[[durable_objects.bindings]]
name = "MONOPOLY"
class_name = "MonopolyRoom"

[[migrations]]
tag = "v7"
new_sqlite_classes = ["MonopolyRoom"]

[[durable_objects.bindings]]
name = "CHIBIRUSH"
class_name = "ChibiRushRoom"

[[migrations]]
tag = "v8"
new_sqlite_classes = ["ChibiRushRoom"]

[[migrations]]
tag = "v9"
new_sqlite_classes = ["UnoRoom"]

[[durable_objects.bindings]]
name = "PARTYCATS"
class_name = "PartyCatsRoom"

[[migrations]]
tag = "v10"
new_sqlite_classes = ["PartyCatsRoom"]

# MebiRan.io: one authoritative simulation per arena, one serial matchmaker.
[[durable_objects.bindings]]
name = "SNAKE"
class_name = "SnakeArena"

[[durable_objects.bindings]]
name = "SNAKE_MATCH"
class_name = "SnakeMatchmaker"

[[migrations]]
tag = "v11"
new_sqlite_classes = ["SnakeArena", "SnakeMatchmaker"]

# Cờ Cá Ngựa 3D: authoritative multiplayer rooms.
[[durable_objects.bindings]]
name = "COCA"
class_name = "CoCaNguaRoom"

[[migrations]]
tag = "v12"
new_sqlite_classes = ["CoCaNguaRoom"]

# Xì Dách: eight human seats and one server dealer, persistent egg escrow.
[[durable_objects.bindings]]
name = "XIDACH"
class_name = "XiDachRoom"

[[migrations]]
tag = "v13"
new_sqlite_classes = ["XiDachRoom"]
